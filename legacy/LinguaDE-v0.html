/* LinguaDE · 设计系统 */
:root{
  --bg:#f4f6fa;
  --bg-soft:#ffffff;
  --panel:#ffffff;
  --panel-2:#f8fafc;
  --line:#e3e8f0;
  --line-soft:#eef2f7;
  --text:#1b2333;
  --text-2:#5a6478;
  --text-3:#8a93a6;
  --brand:#1668dc;
  --brand-soft:#e8f1ff;
  --accent:#f0a020;      /* 德语/德意志金 */
  --ok:#18a058;
  --ok-soft:#e6f6ee;
  --warn:#f0a020;
  --danger:#e05252;
  --danger-soft:#fdecec;
  --shadow:0 2px 8px rgba(20,30,60,.06);
  --shadow-lg:0 12px 36px rgba(20,30,60,.14);
  --radius:14px;
  --radius-sm:10px;
}
:root.dark{
  --bg:#0f131a;
  --bg-soft:#141922;
  --panel:#161c26;
  --panel-2:#1b222e;
  --line:#28303d;
  --line-soft:#212936;
  --text:#e6ebf3;
  --text-2:#a3adbe;
  --text-3:#737e91;
  --brand:#4b93ff;
  --brand-soft:#17263d;
  --ok-soft:#122b22;
  --danger-soft:#33191b;
  --shadow:0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 14px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.de{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
::selection{background:var(--brand);color:#fff}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),#2bb0c9);color:#fff;font-weight:800;letter-spacing:.5px;
  box-shadow:0 4px 12px rgba(22,104,220,.28);
}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text strong{font-size:15px;letter-spacing:.3px}
.brand-text span{font-size:11.5px;color:var(--text-3)}
.topbar-right{display:flex;align-items:center;gap:8px}
.streak-chip,.level-chip{
  padding:5px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);
  font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px;
}
.streak-chip .flame{color:var(--accent)}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
  cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.15s;
}
.icon-btn:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}

/* ---------- 布局 ---------- */
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{
  width:216px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  padding:14px 10px 18px;position:sticky;top:60px;height:calc(100vh - 60px);
  display:flex;flex-direction:column;gap:14px;overflow:auto;
}
.nav-group-title{font-size:11px;color:var(--text-3);padding:0 8px 6px;letter-spacing:1px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius-sm);
  color:var(--text-2);cursor:pointer;margin-bottom:2px;transition:.15s;font-size:13.5px;
}
.nav-item i{font-style:normal;width:18px;text-align:center;opacity:.85}
.nav-item .tag-free{
  font-style:normal;font-size:10px;margin-left:auto;padding:1px 6px;border-radius:5px;
  background:var(--ok-soft);color:var(--ok);
}
.nav-item .badge{
  margin-left:auto;background:var(--danger-soft);color:var(--danger);
  font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600;
}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft)}
.pbar-wrap{margin-bottom:10px}
.pbar-label{font-size:11.5px;color:var(--text-3);display:flex;justify-content:space-between;margin-bottom:5px}
.pbar{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.pbar-in{height:100%;background:linear-gradient(90deg,var(--brand),#2bb0c9);border-radius:999px;transition:width .5s}

.content{flex:1;padding:22px 26px 60px;max-width:1180px;min-width:0}

/* ---------- 通用组件 ---------- */
.page-head{margin-bottom:18px}
.page-head h1{margin:0 0 4px;font-size:21px;letter-spacing:.3px}
.page-head p{margin:0;color:var(--text-3);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:680px){
  .sidebar{display:none}
  .content{padding:16px 14px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr}
}

.btn{
  padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
  cursor:pointer;transition:.15s;font-size:13.5px;
}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent}
.btn-block{width:100%}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11.5px;color:var(--text-3)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:.5px}
.stat .v small{font-size:12px;font-weight:500;color:var(--text-3);margin-left:3px}
.stat .s{font-size:11.5px}
.up{color:var(--ok)}.down{color:var(--danger)}

.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-2)}
.tag-blue{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.tag-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag-warn{background:#fdf3e2;color:#b8791a;border-color:transparent}
.tag-danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
:root.dark .tag-warn{background:#33270f;color:#e0b256}

.divider{margin:16px 0 12px;border-top:1px solid var(--line-soft);position:relative}
.divider span{
  position:absolute;top:-9px;left:0;background:var(--panel);padding-right:8px;
  font-size:11px;color:var(--text-3);
}
.hint{font-size:12px;color:var(--text-3);line-height:1.7;margin:8px 0 0}
.empty{padding:44px 20px;text-align:center;color:var(--text-3)}
.empty .big{font-size:34px;opacity:.4;margin-bottom:8px}

textarea,input[type=text],input[type=password],input[type=number],select{
  width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);outline:none;transition:.15s;
}
textarea:focus,input:focus,select:focus{border-color:var(--brand);background:var(--panel)}
textarea{resize:vertical;min-height:96px;line-height:1.7}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:var(--text-3);margin-bottom:5px}

/* ---------- 单词卡片 ---------- */
.vocab-stage{display:flex;flex-direction:column;align-items:center;padding:34px 20px 26px}
.vocab-word{font-size:40px;font-weight:700;letter-spacing:.5px;text-align:center;line-height:1.2}
.vocab-art{font-size:22px;color:var(--brand);margin-right:6px;font-weight:500}
.vocab-phon{color:var(--text-3);font-size:13px;margin-top:6px}
.vocab-zh{margin-top:14px;font-size:19px;color:var(--text-2)}
.vocab-ex{
  margin-top:18px;padding:13px 16px;border-radius:var(--radius-sm);background:var(--panel-2);
  border:1px dashed var(--line);max-width:620px;width:100%;
}
.vocab-ex .de{font-size:15px}
.vocab-ex .zh{font-size:13px;color:var(--text-3);margin-top:5px}
.vocab-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.vocab-actions .btn{min-width:96px}
.rate-bar{display:flex;gap:8px;justify-content:center;margin-top:16px}
.rate-btn{padding:7px 14px;border-radius:9px;border:1px solid var(--line);cursor:pointer;background:var(--panel-2);font-size:13px}
.rate-btn:hover{border-color:var(--brand);color:var(--brand)}
.rate-btn[data-v="0"]:hover{border-color:var(--danger);color:var(--danger)}
.rate-btn[data-v="1"]:hover{border-color:var(--warn);color:var(--warn)}
.rate-btn[data-v="3"]:hover{border-color:var(--ok);color:var(--ok)}
.progress-line{height:4px;background:var(--line-soft);border-radius:999px;overflow:hidden;margin-top:22px;width:100%;max-width:520px}
.progress-line i{display:block;height:100%;background:var(--brand);transition:width .4s}

/* ---------- 纠错 ---------- */
.corr-diff{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.corr-item{padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel-2)}
.corr-item .row{display:flex;gap:10px;align-items:flex-start}
.corr-item .badge-x{
  flex-shrink:0;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  background:var(--danger-soft);color:var(--danger);font-size:12px;margin-top:1px;
}
.corr-item .badge-v{flex-shrink:0;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);font-size:12px;margin-top:1px}
.corr-item del{color:var(--danger);text-decoration:line-through;text-decoration-thickness:1.5px}
.corr-item ins{color:var(--ok);text-decoration:none;font-weight:600}
.corr-item .why{font-size:12.5px;color:var(--text-3);margin-top:6px;line-height:1.7}
.score-ring{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:76px;height:76px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:700}

/* ---------- 对话 ---------- */
.chat-shell{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px}
.chat-log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 13px;border-radius:12px;line-height:1.75;font-size:13.8px;white-space:pre-wrap;word-break:break-word}
.msg.ai{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-top-left-radius:3px}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-top-right-radius:3px}
.msg .tip{display:block;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:12px;color:var(--text-3)}
.msg.me .tip{border-top-color:rgba(255,255,255,.35);color:rgba(255,255,255,.85)}
.msg.system{align-self:center;background:transparent;color:var(--text-3);font-size:12px;text-align:center;max-width:90%}
.chat-input{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{min-height:44px;max-height:120px;flex:1}
.scenes{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.scene-chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;background:var(--panel-2)}
.scene-chip:hover{border-color:var(--brand);color:var(--brand)}
.scene-chip.active{background:var(--brand-soft);color:var(--brand);border-color:transparent;font-weight:600}

/* ---------- 口语 ---------- */
.mic-btn{
  width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;font-size:30px;color:#fff;
  background:linear-gradient(135deg,var(--brand),#2bb0c9);box-shadow:0 8px 24px rgba(22,104,220,.3);
  transition:.2s;display:grid;place-items:center;
}
.mic-btn:hover{transform:scale(1.05)}
.mic-btn.recording{background:linear-gradient(135deg,#e05252,#f07c3c);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,82,82,.45)}70%{box-shadow:0 0 0 18px rgba(224,82,82,0)}100%{box-shadow:0 0 0 0 rgba(224,82,82,0)}}
.transcript{
  margin-top:14px;padding:13px 15px;border-radius:var(--radius-sm);background:var(--panel-2);
  border:1px dashed var(--line);min-height:56px;font-size:14px;
}
.transcript .ph{color:var(--text-3);font-size:13px}
.dims{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.dim-row{display:flex;align-items:center;gap:10px}
.dim-row .n{flex-shrink:0;width:64px;font-size:12.5px;color:var(--text-2)}
.dim-bar{flex:1;height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.dim-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#2bb0c9);transition:width .6s}
.dim-row .s{flex-shrink:0;width:44px;text-align:right;font-size:13px;font-weight:600}

/* ---------- 列表 / 表格 ---------- */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--panel-2)}
.list-item .main{flex:1;min-width:0}
.list-item .t1{font-size:14px;font-weight:500}
.list-item .t2{font-size:12.5px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line-soft)}
table.tbl th{color:var(--text-3);font-weight:500;font-size:12px}
table.tbl tr:hover td{background:var(--panel-2)}

/* ---------- 面试 ---------- */
.iv-stage{display:flex;flex-direction:column;gap:14px}
.iv-q{padding:16px 18px;border-radius:var(--radius);background:linear-gradient(135deg,var(--brand-soft),transparent);border:1px solid var(--line)}
.iv-q .de{font-size:17px;font-weight:600;line-height:1.6}
.iv-q .zh{font-size:13px;color:var(--text-3);margin-top:6px}
.report-sec{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.report-sec:last-child{border-bottom:none}
.report-sec h4{margin:0 0 8px;font-size:13.5px}
.report-sec p{margin:0;font-size:13px;color:var(--text-2);line-height:1.8}

/* ---------- 抽屉 / 提示 ---------- */
.drawer-mask{position:fixed;inset:0;background:rgba(15,20,30,.42);opacity:0;pointer-events:none;transition:.2s;z-index:50}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;width:360px;max-width:92vw;height:100%;background:var(--panel);
  border-left:1px solid var(--line);z-index:60;transform:translateX(102%);transition:.25s;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-head h3{margin:0;font-size:15px}
.drawer-body{padding:16px 18px 40px;overflow:auto}

.toast-wrap{position:fixed;top:74px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow-lg);font-size:13px;animation:slideIn .25s;max-width:320px;
}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast.ok{border-left:3px solid var(--ok)}
.toast.err{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--brand)}

/* 执行摘要封面 */
.cover{text-align:center;padding:44px 20px 30px}
.cover h1{font-size:26px;margin:0 0 8px}
.cover .sub{color:var(--text-3);font-size:13.5px}
.mod-grid{margin-top:22px;text-align:left}
.mod-card{padding:14px 15px;cursor:pointer;transition:.18s}
.mod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--brand)}
.mod-card .ic{font-size:20px}
.mod-card .nm{font-weight:600;margin-top:4px;font-size:14px}
.mod-card .ds{font-size:12px;color:var(--text-3);margin-top:3px;line-height:1.6}
.mod-card .foot{margin-top:9px;display:flex;justify-content:space-between;align-items:center}

/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::-webkit-scrollbar-track{background:transparent}

</style>
</head>

      examDate: "",           // 考试日期：驱动 fitToExam 倒排调度
      createdAt: Date.now()
    },
    cfg: { apiBase: "", apiKey: "", model: "", backend: "", theme: "light", llmOn: false },
    cards: {},          // word -> {ef, iv, due, reps, lapses, ok, bad, history:[]}
    log: [],            // 逐题作答流水
    wrong: [],          // 错题本
    sessions: [],       // 每次学习会话
    daily: {},          // { date: minutes }
    ability: { vocab: 50, grammar: 50, listening: 40, speaking: 40, reading: 50, writing: 45 },
    chats: {},          // sceneId -> messages
    interviews: [],     // 模拟面试记录
    speeches: [],       // 口语测评记录
    plan: null,         // 自适应学习计划
    diagnosed: false,   // 是否完成入学诊断
    visited: {}         // 模块访问计数（就绪度用）
  };

  let state = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state = Object.assign({}, DEF, parsed);
        // 浅合并二级对象，兼容早期版本
        ["profile", "cfg", "ability"].forEach(k => {
          state[k] = Object.assign({}, DEF[k], parsed[k] || {});
        });
        return state;
      }
    } catch (e) { console.warn("读取本地数据失败，使用默认档案", e); }
    state = JSON.parse(JSON.stringify(DEF));
    return state;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn("保存失败", e); }
  }

  const today = () => new Date().toISOString().slice(0, 10);

  const Store = {
    get s() { return state || load(); },
    load, save,
    reset() { state = JSON.parse(JSON.stringify(DEF)); save(); },

    /* ---- 每日时长 ---- */
    addMinutes(n) {
      const d = today();
      const s = Store.s;
      s.daily[d] = (s.daily[d] || 0) + n;
      save();
    },
    todayMinutes() { const s = Store.s; return s.daily[today()] || 0; },
    streak() {
      const s = Store.s;
      let n = 0;
      const d = new Date();
      for (let i = 0; i < 400; i++) {
        const key = new Date(d.getTime() - i * 86400000).toISOString().slice(0, 10);
        if ((s.daily[key] || 0) > 0) n++;
        else if (i > 0) break;
      }
      return n;
    },

    /* ---- 访问足迹（八大模块就绪度） ---- */
    visit(route) {
      const s = Store.s;
      s.visited[route] = (s.visited[route] || 0) + 1;
      save();
    },
    visitedCount() {
      const s = Store.s;
      const mods = ["diagnose", "vocab", "grammar", "chat", "speech", "listening", "drill",
        "syntax", "writing", "notebook", "analytics", "plan", "interview", "competitive"];
      const done = mods.filter(m => (s.visited[m] || 0) > 0).length;
      return { done, total: mods.length };
    },

    /* ---- 学习流水 ---- */
    logAnswer(rec) {
      const s = Store.s;
      rec.t = rec.t || Date.now();
      s.log.push(rec);
      if (s.log.length > 6000) s.log = s.log.slice(-4000);
      // 能力值在线更新（指数平滑）
      if (rec.ability) {
        const a = s.ability;
        const delta = rec.ok ? 1.2 : -1.6;
        a[rec.ability] = Math.max(5, Math.min(99, Math.round((a[rec.ability] || 50) + delta)));
      }
      // BKT 知识追踪：以知识点为单位更新掌握概率
      if (rec.skill && window.LD.Engine) {
        window.LD.Engine.bktUpdate(rec.skill, !!rec.ok);
      }
      save();
    },

    /* ---- 错题库 ---- */
    addWrong(item) {
      const s = Store.s;
      item.id = "w" + Date.now() + Math.random().toString(36).slice(2, 6);
      item.t = Date.now();
      item.mastered = false;
      item.times = 0;
      s.wrong.unshift(item);
      if (s.wrong.length > 800) s.wrong = s.wrong.slice(0, 600);
      save();
      return item;
    },
    wrongPending() { return Store.s.wrong.filter(w => !w.mastered); },
    toggleWrong(id) {
      const s = Store.s;
      const it = s.wrong.find(w => w.id === id);
      if (it) { it.mastered = !it.mastered; save(); }
      return it;
    },
    reviewWrong(id, ok) {
      const s = Store.s;
      const it = s.wrong.find(w => w.id === id);
      if (it) {
        it.times = (it.times || 0) + 1;
        if (ok && it.times >= 2) it.mastered = true;
        save();
      }
    },

    /* ---- 会话 ---- */
    addSession(rec) {
      const s = Store.s;
      rec.t = rec.t || Date.now();
      s.sessions.push(rec);
      if (s.sessions.length > 500) s.sessions = s.sessions.slice(-300);
      Store.addMinutes(Math.max(1, Math.round((rec.ms || 0) / 60000)));
      save();
    },

    /* ---- 导出 / 导入 ---- */
    exportData() { return JSON.stringify(Store.s, null, 2); },

    /* ---- 与后端同步（可选） ---- */
    sync() {
      const cfg = Store.s.cfg;
      if (!cfg.backend) return Promise.reject(new Error("未配置后端地址"));
      return fetch(cfg.backend.replace(/\/$/, "") + "/api/sync", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ profile: Store.s.profile, ability: Store.s.ability, log: Store.s.log.slice(-200) })
      }).then(r => r.json());
    }
  };

  window.LD = window.LD || {};
  window.LD.Store = Store;
  load();
})();

</script>
<script data-page-node-id="flLDz2YYendnW8Z6FNhIw1" data-pnid-children="q7WjUx3O3vESTvWFymRNsR">
/* LinguaDE · 自适应学习与测评引擎
   1) SM-2 简化间隔重复（单词/错题复习调度）
   2) 难度动态调整（依据正确率、作答耗时、错题类型）
   3) 薄弱点诊断与能力画像
   4) 口语三维评分（重音 / 语调 / 流利度）
====================================================================== */
(function () {
  const S = () => window.LD.Store.s;

  const LEVELS = ["A1", "A2", "B1", "B2"];
  const lvIndex = l => Math.max(0, LEVELS.indexOf(l));

  /* ============ 1. 间隔重复 (SM-2 简化) ============ */
  function getCard(word) {
    const s = S();
    return s.cards[word] || { ef: 2.5, iv: 0, due: Date.now(), reps: 0, lapses: 0, ok: 0, bad: 0, history: [] };
  }

  function rate(word, q) {
    // q: 0 完全不会 / 1 想起来了但很难 / 2 一般 / 3 轻松
    const s = S();
    const c = Object.assign({}, getCard(word));
    c.reps += 1;
    c.history.push({ t: Date.now(), q });

    if (q >= 2) {
      c.ok += 1;
      if (c.iv === 0) c.iv = q === 3 ? 1 : 0.5;
      else c.iv = c.iv * c.ef * (q === 3 ? 1.15 : 1.0);
      c.ef = Math.max(1.3, c.ef + (0.1 - (3 - q) * (0.08 + (3 - q) * 0.02)));
    } else {
      c.bad += 1;
      c.lapses += 1;
      c.iv = 0;                 // 当天重新出现
      c.ef = Math.max(1.3, c.ef - 0.2);
    }
    c.iv = Math.min(c.iv, 180); // 上限 180 天
    c.due = Date.now() + c.iv * 86400000;
    s.cards[word] = c;
    window.LD.Store.save();
    return c;
  }

  const dueList = () => Object.keys(S().cards).filter(w => (S().cards[w].due || 0) <= Date.now());
  const newCount = () => LEX().length - Object.keys(S().cards).length;

  /* ============ 2. 词库访问 ============ */
  const LEX = () => window.LD_LEX || [];
  const LEVEL_CAP = { A1: 1.0, A2: 0.85, B1: 0.6, B2: 0.25 }; // 起点越低，A1 权重越大

  function levelWeight(wordLevel, started, target) {
    const d = lvIndex(wordLevel) - lvIndex(started);
    if (d > 1) return 0.15;                 // 远超当前水平，暂时不放
    if (d < -1) return 0.4;                 // 过于简单
    return 1.0;
  }

  /* 今日学习队列：到期复习 + 自适应新词 */
  function buildQueue(size) {
    size = size || 20;
    const s = S();
    const due = dueList().sort((a, b) => (s.cards[a].due || 0) - (s.cards[b].due || 0));
    const need = Math.max(0, size - due.length);
    const seen = new Set(due);
    const pool = LEX().filter(w => !seen.has(w[0]));

    const weights = pool.map(w => {
      const card = s.cards[w[0]];
      if (card) return 0;
      let base = levelWeight(w[4], s.profile.level, s.profile.exam);
      // 薄弱领域加权
      if (w[4] === "B1" && s.ability.grammar < 55) base *= 1.1;
      return base;
    });

    const picked = [];
    const idx = pool.map((_, i) => i);
    // 带权不放回抽样
    let total = weights.reduce((a, b) => a + b, 0);
    for (let k = 0; k < need && total > 0; k++) {
      let r = Math.random() * total, acc = 0, chosen = -1;
      for (let i = 0; i < idx.length; i++) {
        acc += weights[idx[i]];
        if (r <= acc) { chosen = i; break; }
      }
      if (chosen < 0) break;
      picked.push(pool[idx[chosen]]);
      total -= weights[idx[chosen]];
      idx.splice(chosen, 1);
    }

    const q = due.map(w => entryOf(w, true)).concat(picked.map(w => entryOf(w[0], false)));
    return q.slice(0, size);
  }

  function entryOf(word, isDue) {
    const lex = LEX().find(x => x[0] === word);
    const c = getCard(word);
    return lex ? {
      de: lex[0], art: lex[1], zh: lex[2], pos: lex[3], lv: lex[4], ex: lex[5], exzh: lex[6],
      isDue, reps: c.reps, ok: c.ok, bad: c.bad, ef: +c.ef.toFixed(2)
    } : null;
  }

  /* ============ 3. 难度动态调整 ============ */
  /* 输入：近 n 次作答记录；输出 1–5 档难度 + 建议 */
  function nextDifficulty(records) {
    if (!records || !records.length) return { level: 2, reason: "暂无历史数据，从中间难度起步" };
    const recent = records.slice(-10);
    const acc = recent.filter(r => r.ok).length / recent.length;
    const avgMs = recent.reduce((a, r) => a + (r.ms || 0), 0) / recent.length;
    let level = 2;
    if (acc >= 0.85 && avgMs < 6000) level = 4;
    else if (acc >= 0.7) level = 3;
    else if (acc >= 0.5) level = 2;
    else level = 1;
    let reason;
    if (acc >= 0.85 && avgMs < 6000) reason = "正确率高且反应快，上调难度并缩短复习间隔";
    else if (acc >= 0.7) reason = "表现稳定，维持中等难度并缓慢加量";
    else if (acc >= 0.5) reason = "波动明显，回到巩固题型并增加例句提示";
    else reason = "错误偏多，下调难度、回到高频基础词并缩短每次训练量";
    return { level, reason, acc: +(acc * 100).toFixed(0), avgMs: Math.round(avgMs) };
  }

  /* ============ 4. 薄弱点画像 ============ */
  function weakPoints() {
    const s = S();
    const recentLog = s.log.slice(-120);
    const byType = {};
    recentLog.forEach(r => {
      const k = r.type || "综合";
      byType[k] = byType[k] || { n: 0, ok: 0 };
      byType[k].n++;
      if (r.ok) byType[k].ok++;
    });
    const list = Object.keys(byType).map(k => ({
      key: k, total: byType[k].n,
      acc: Math.round(byType[k].ok / byType[k].n * 100)
    })).sort((a, b) => a.acc - b.acc);

    const ability = s.ability;
    const abilitySorted = Object.keys(ability).map(k => ({ key: k, v: ability[k] })).sort((a, b) => a.v - b.v);
    return { byType: list, weakest: abilitySorted.slice(0, 3), ability };
  }

  function radarData() {
    const a = S().ability;
    const map = { vocab: "词汇", grammar: "语法", reading: "阅读", listening: "听力", speaking: "口语", writing: "写作" };
    return Object.keys(a).map(k => ({ key: map[k] || k, value: a[k] }));
  }

  /* ============ 5. 口语三维评分 ============ */
  /* 输入：参考文本 ref 与识别结果 hyp
     维度：重音 stress、语调 intonation、流利度 fluency ---- 均为启发式，定位为辅助参考分 */
  function scoreSpeech(ref, hyp, meta) {
    meta = meta || {};
    const norm = t => (t || "").toLowerCase().replace(/[.,!?;:"„“”]/g, "").replace(/\s+/g, " ").trim();
    const A = norm(ref).split(" ").filter(Boolean);
    const B = norm(hyp).split(" ").filter(Boolean);
    if (!B.length) return null;

    // 词错率 WER（Levenshtein）
    const dist =lev(A, B);
    const wer = dist / Math.max(1, A.length);
    const accuracy = Math.max(0, 100 - Math.round(wer * 100));

    // 完整性：覆盖参考词的比例
    const setB = new Set(B);
    const coverage = Math.round(A.filter(w => setB.has(w)).length / Math.max(1, A.length) * 100);

    // 流利度：语速（词/分钟）+ 停顿次数
    const sec = Math.max(1, (meta.ms || 6000) / 1000);
    const wpm = Math.round(B.length / (sec / 60));
    let fluency = 100 - Math.abs(110 - wpm) * 0.55;
    if (wpm < 60) fluency -= 12;
    if (meta.pauses > B.length * 0.5) fluency -= 10;
    fluency = clamp(Math.round(fluency), 20, 100);

    // 重音：德语词重音多在首音节，以识别出的长词/多音节词比例 + 准确度合成
    const poly = B.filter(w => w.length >= 6).length;
    const stressSeed = Math.min(30, poly * 4);
    let stress = Math.round(accuracy * 0.65 + stressSeed);
    stress = clamp(stress, 20, 100);

    // 语调：句末升降由标点与句长启发式推断，随机扰动很小以保证可复现
    const q = /\?$/.test((ref || "").trim());
    let intonation = Math.round(accuracy * 0.6 + coverage * 0.25 + (q ? 12 : 6));
    intonation = clamp(intonation, 20, 100);

    const total = Math.round(accuracy * 0.4 + fluency * 0.25 + stress * 0.2 + intonation * 0.15);

    return {
      accuracy, fluency, stress, intonation, total, wpm,
      coverage,
      grade: total >= 85 ? "优秀" : total >= 70 ? "良好" : total >= 55 ? "合格" : "需加强",
      advice: speechAdvice({ accuracy, fluency, stress, intonation, coverage, wpm })
    };
  }

  function speechAdvice(d) {
    const tips = [];
    if (d.accuracy < 70) tips.push("单词识别率偏低，先把句中的实词逐个读准，再连读整句。");
    if (d.fluency < 70) tips.push(`语速约 ${d.wpm} 词/分钟，德语自然语速约 110–140 词/分钟，建议跟读原文音频训练节奏。`);
    if (d.stress < 70) tips.push("注意德语词重音多落在第一个音节，长词尤其明显（如 Univer-si-tät）。");
    if (d.intonation < 70) tips.push("疑问句句末上扬、陈述句句末下降，AUDIOLINGUAL 影子跟读可快速改善语调。");
    if (!tips.length) tips.push("整体表现不错，建议把本句加入跟读库中，隔两天再录一次做对照。");
    return tips;
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  /* ============ 6. 文本相似度 / 关键词命中（诊断与面试用） ============ */
  function hitRatio(text, keywords) {
    const t = (text || "").toLowerCase();
    if (!keywords.length) return 0;
    const n = keywords.filter(k => t.includes(k.toLowerCase())).length;
    return n / keywords.length;
  }

  /* ============ 7. 学习计划生成 ============ */
  /* 依据：薄弱能力项 × 每日可用时长 × 到期复习量，生成未来 N 天的日程 */
  function makePlan(days) {
    days = days || 28;
    const s = S();
    const weak = weakPoints().weakest.map(w => w.key);
    const daily = s.profile.dailyMin || 30;
    const due = window.LD.Engine.dueCount();
    const nameMap = { vocab: "词汇", grammar: "语法", reading: "阅读", listening: "听力", speaking: "口语", writing: "写作" };
    const focus = weak.length ? weak.slice(0, 2) : ["vocab", "grammar"];

    const slots = {
      vocab: ["新词 15 个＋复习", "例句听写 5 句"],
      grammar: ["句法纠错 8 句", "从句语序专项 5 题"],
      reading: ["短文精读 1 篇", "标记长难句 3 句"],
      listening: ["德语播客精听 10 分钟", "听写填空 6 题"],
      speaking: ["跟读评分 5 句", "AI 德语对话 1 场景"],
      writing: ["主题写作 150 词", "用词典回暖错题 5 条"]
    };
    // 每日：单词(基础) + 主薄弱项 + 次薄弱项
    const plan = [];
    const base = Math.max(10, Math.round(daily * 0.4));
    for (let i = 0; i < days; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      const date = d.toISOString().slice(0, 10);
      const tasks = [];
      tasks.push({ mod: "vocab", text: `${entryAmount(base)}词配额：到期复习 ${Math.min(due + i * 3, 25)} 个 + 新学 10 个`, min: base });
      focus.forEach((f, k) => {
        const pool = slots[f] || slots.vocab;
        const pick = pool[i % pool.length];
        tasks.push({ mod: f, text: pick, min: Math.round(daily * (k === 0 ? 0.35 : 0.25)) });
      });
      if (i % 7 === 6) tasks.push({ mod: "review", text: "本周复盘：重做错题本中未掌握的条目", min: Math.round(daily * 0.3) });
      plan.push({ date, week: Math.floor(i / 7) + 1, tasks, focus: focus.map(f => nameMap[f] || f) });
    }
    return { generatedAt: Date.now(), days, daily, focus: focus.map(f => nameMap[f] || f), plan };
  }

  function entryAmount(min) { return Math.round(min * 1.2 / 10) * 10; }

  /* ============ 8. BKT 贝叶斯知识追踪 ============
     经典四参数模型：pInit(初始掌握概率) / pTransit(学习转移) / pSlip(会但做错) / pGuess(不会但蒙对)
     对任意知识点 k：
       P(known|correct) = P(k)(1-slip) / [P(k)(1-slip) + (1-P(k))·guess]
       P(known|wrong)   = P(k)·slip / [P(k)·slip + (1-P(k))(1-guess)]
     学习转移：P(k) ← P(k) + (1-P(k))·pTransit
     可解释输出：掌握概率、预测下次正确率、是否达到 95% 掌握阈值。 */
  const BKT = { pInit: 0.18, pTransit: 0.16, pSlip: 0.09, pGuess: 0.22 };

  function bktState(skill) {
    const s = S();
    s.bkt = s.bkt || {};
    if (s.bkt[skill] == null) s.bkt[skill] = BKT.pInit;
    return s.bkt[skill];
  }

  function bktUpdate(skill, ok) {
    const s = S();
    s.bkt = s.bkt || {};
    let p = s.bkt[skill] == null ? BKT.pInit : s.bkt[skill];
    const { pSlip, pGuess, pTransit } = BKT;
    if (ok) {
      const num = p * (1 - pSlip);
      p = num / (num + (1 - p) * pGuess);
    } else {
      const num = p * pSlip;
      p = num / (num + (1 - p) * (1 - pGuess));
    }
    p = p + (1 - p) * pTransit;              // 学习转移
    s.bkt[skill] = Math.min(0.995, Math.max(0.01, p));
    (s.bktN = s.bktN || {})[skill] = (s.bktN[skill] || 0) + 1;
    window.LD.Store.save();
    return s.bkt[skill];
  }

  /* 预测该知识点下一次作答正确的概率 */
  function bktPredict(skill) {
    const p = bktState(skill);
    return Math.round((p * (1 - BKT.pSlip) + (1 - p) * BKT.pGuess) * 100);
  }

  /* 全库掌握度分布：用于学情页与首页总览 */
  function masterySummary() {
    const s = S();
    const bkt = s.bkt || {};
    const keys = Object.keys(bkt);
    if (!keys.length) return { n: 0, avg: 0, mastered: 0, bands: [0, 0, 0, 0, 0] };
    const bands = [0, 0, 0, 0, 0];     // 0-20 / 20-40 / 40-60 / 60-80 / 80-100
    let sum = 0, mastered = 0;
    keys.forEach(k => {
      const v = bkt[k];
      sum += v;
      if (v >= 0.95) mastered++;
      bands[Math.min(4, Math.floor(v * 5))]++;
    });
    return { n: keys.length, avg: Math.round(sum / keys.length * 100), mastered, bands };
  }

  /* ============ 9. 考试倒排调度 fitToExam ============
     借鉴 spaced-repetition-lite：设考试日为 D，若某词条的下次复习晚于 D，
     则把复习日期压缩到 D 之前，并随 D 临近缩短间隔；考试前一天安排「最后一遍」。
     对留德场景（TestDaF/DSH 有明确考期）是真正有用的差异化能力。 */
  function fitToExam(dueTs, examDate) {
    if (!examDate) return { due: dueTs, adjusted: false };
    const exam = new Date(examDate + "T00:00:00").getTime();
    const now = Date.now();
    if (!exam || exam <= now) return { due: dueTs, adjusted: false };
    const day = 86400000;
    const daysLeft = Math.ceil((exam - now) / day);
    // 该词条复习间隔
    let iv = Math.max(1, Math.round((dueTs - now) / day));
    if (dueTs <= exam) return { due: dueTs, adjusted: false, daysLeft };
    // 压缩：保证考试前至少再见 1 次，临近时缩短
    let target;
    if (daysLeft <= 3) target = exam - day;                            // 考前一天最后一遍
    else if (daysLeft <= 10) target = now + Math.min(iv, Math.floor(daysLeft / 2)) * day;
    else target = now + Math.min(iv, daysLeft - 3) * day;
    return { due: Math.min(exam - day, Math.max(now + day, target)), adjusted: true, daysLeft, compressed: Math.round(iv * 1) };
  }

  /* 考试模式下的今日队列：到期 + 被倒排压缩进来的词条 */
  function examQueue(size, examDate) {
    const s = S();
    const list = Object.keys(s.cards).map(w => {
      const c = s.cards[w];
      const fit = fitToExam(c.due || Date.now(), examDate);
      return { w, due: fit.due, adjusted: fit.adjusted };
    }).filter(x => x.due <= Date.now() + 86400000)
      .sort((a, b) => a.due - b.due);
    return list.slice(0, size || 30);
  }

  window.LD.Engine = {
    rate, getCard, dueList, buildQueue, entryOf, nextDifficulty,
    weakPoints, radarData, scoreSpeech, hitRatio, makePlan, LEVELS,
    bktUpdate, bktState, bktPredict, masterySummary, fitToExam, examQueue, BKT,
    dueCount: () => dueList().length
  };
})();

<script data-page-node-id="444AQolfYi6didy10IIxHZ" data-pnid-children="J3KqUvilQ2fJjr89kZc11l">
/* LinguaDE · 大模型适配层 + 本地规则引擎
   - 配置了 API：OpenAI 兼容 /chat/completions（对话 / 纠错 / 面试评估）
   - 未配置或请求失败：自动降级为本地规则引擎，保证离线可用 */
(function () {
  const cfg = () => window.LD.Store.s.cfg;

  const ready = () => { const c = cfg(); return !!(c.apiBase && c.apiKey); };

  function chat(messages, opts) {
    opts = opts || {};
    const c = cfg();
    const body = {
      model: c.model || "gpt-4o-mini",
      messages,
      temperature: opts.temperature != null ? opts.temperature : 0.7,
      stream: false
    };
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), opts.timeout || 45000);
    return fetch(c.apiBase.replace(/\/$/, "") + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + c.apiKey },
      body: JSON.stringify(body),
      signal: ctrl.signal
    })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(j => {
        clearTimeout(timer);
        const txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (!txt) throw new Error("空响应");
        return txt.trim();
      })
      .catch(e => { clearTimeout(timer); throw e; });
  }

  /* ============ 本地规则纠错（离线兜底） ============ */
  function localCheck(sentence) {
    const R = window.LD_RULES;
    const issues = [];
    const nouns = new Set((window.LD_LEX || []).map(x => x[0]));
    ["Hausaufgabe", "Freund", "Wohnung", "Universität", "Prüfung", "Semester", "Seminar", "Bibliothek",
      "Forschung", "Antrag", "Zeugnis", "Bewerbung", "Zulassung", "Versicherung", "Internet", "Frage",
      "Zeit", "Kaffee", "Musik", "Geschichte", "Physik", "Wetter", "Auto", "Bus", "Arbeit", "Stadt"
    ].forEach(n => nouns.add(n));

    const lower = sentence.toLowerCase();
    const cands = Object.create(null);

    // A. 词典规则
    R.dict.forEach(r => {
      if (r.id === "ok" || !r.why) return;
      if (r.p.test(sentence)) {
        cands[hash(r.why + r.idx)] = {
          type: ruleTypeOf(r.why),
          why: r.why,
          sev: r.sev || "warn",
          wrong: (sentence.match(r.p) || [""])[0],
          fix: ""
        };
      }
    });

    // B. 结构检查
    R.checks.forEach(chk => {
      let res = [];
      try { res = chk.run(sentence, { nouns }) || []; } catch (e) { console.warn("规则异常", chk.name, e); }
      res.forEach(one => {
        if (!one || (!one.wrong && !one.why)) return;
        cands[hash(chk.name + one.why + (one.wrong || ""))] = {
          type: one.type || chk.name,
          why: one.why,
          wrong: one.wrong || "",
          fix: one.fix || "",
          sev: "warn"
        };
      });
    });

    Object.keys(cands).forEach(k => issues.push(cands[k]));
    return issues;
  }

  function ruleTypeOf(why) {
    if (/首字母/.test(why)) return "正字法";
    if (/助动词|haben|sein/.test(why)) return "助动词";
    if (/语序|句末|第三位/.test(why)) return "语序";
    if (/格|第四格|第三格|第二格/.test(why)) return "格变化";
    if (/否定|kein/.test(why)) return "否定";
    if (/搭配|不够正式|第二格/.test(why)) return "搭配";
    return "综合";
  }

  function hash(s) { return s; }

  /* ============ 对外：语法纠错 ============ */
  function correct(sentence) {
    if (!sentence || !sentence.trim()) return Promise.resolve({ issues: [], source: "none" });
    if (ready()) {
      const sys = `你是德语语法纠错引擎。输入一句德语，输出严格的 JSON 数组（不要任何解释文字），每项：
{"type":"错误类型","wrong":"原文中的错误片段","fix":"修改后的片段","why":"中文讲解（不超过40字）"}
若无错误返回 []。仅纠正德语问题，保持用户的表达意图。`;
      return chat([
        { role: "system", content: sys },
        { role: "user", content: sentence }
      ], { temperature: 0.2 })
        .then(txt => {
          const arr = safeJSON(txt);
          if (!Array.isArray(arr)) throw new Error("解析失败");
          return { issues: arr, source: "llm" };
        })
        .catch(() => ({ issues: localCheck(sentence), source: "local" }));
    }
    return Promise.resolve({ issues: localCheck(sentence), source: "local" });
  }

  function localCheckSync(s) { return localCheck(s); }

  /* ============ 对话回复 ============ */
  function reply(scene, history, text) {
    const local = localReply(scene, text);
    if (!ready()) return Promise.resolve({ text: local.r, tip: local.t, source: "local" });
    return chat([
      { role: "system", content: scene.sys },
    ].concat(history.slice(-8)).concat([{ role: "user", content: text }]), { temperature: 0.8 })
      .then(t => splitTip(t, local.t))
      .catch(() => ({ text: local.r, tip: local.t, source: "local" }));
  }

  function splitTip(txt, fallbackTip) {
    // 允许模型以 "---" 分割德语回复与中文点评
    const parts = txt.split(/\n?---+\n?/);
    if (parts.length > 1) return { text: parts[0].trim(), tip: parts.slice(1).join("\n").trim(), source: "llm" };
    return { text: txt.trim(), tip: fallbackTip, source: "llm" };
  }

  function localReply(scene, text) {
    const lowers = (text || "");
    for (const r of scene.replies) { if (r.m.test(lowers)) return { r: r.r, t: r.t }; }
    const fb = scene.fallback;
    return { r: fb[Math.floor(Math.random() * fb.length)], t: "" };
  }

  /* ============ 面试评估 ============ */
  function evaluateInterview(items) {
    const dims = LocalInterviewEval(items);
    if (!ready()) return Promise.resolve(dims);
    const sys = `你是 APS 审核与德国高校面试评估专家。依据问答记录输出严格 JSON：
{"total":0-100,"vocab":分数,"grammar":分数,"logic":分数,"delivery":分数,
 "strengths":["中文短语"],"risks":["中文短语"],"advice":["中文建议"],"rewrite":"针对最弱一题的德语改写示范"}
不要输出 JSON 以外的内容。`;
    const body = items.map((it, i) => `Q${i + 1}: ${it.q}\nA${i + 1}: ${it.a}`).join("\n\n");
    return chat([{ role: "system", content: sys }, { role: "user", content: body }], { temperature: 0.3 })
      .then(txt => { const j = safeJSON(txt); if (!j) throw new Error("解析失败"); j.source = "llm"; return j; })
      .catch(() => dims);
  }

  function LocalInterviewEval(items) {
    const E = window.LD.Engine;
    let totalQ = 0, covered = 0, lenSum = 0, concrete = 0;
    items.forEach(it => {
      const a = (it.a || "").trim();
      if (!a) return;
      totalQ++;
      lenSum += a.split(/\s+/).length;
      const hit = E.hitRatio(a, it.keywords || []);
      covered += hit;
      if (/\d|weil|zum Beispiel|beispielsweise|und zwar|deshalb/i.test(a)) concrete++;
    });
    if (!totalQ) return { total: 0, src: "local" };
    const avgLen = lenSum / totalQ;
    const coverage = Math.round(covered / totalQ * 100);
    const logic = clamp(Math.round(concrete / totalQ * 60 + coverage * 0.4), 10, 100);
    const delivery = clamp(Math.round(Math.min(100, avgLen * 5.5)), 15, 100); // 句长 → 表达充分度
    const vocab = clamp(Math.round(coverage * 0.7 + Math.min(40, avgLen * 2)), 10, 100);
    const ab = window.LD.Store.s.ability;
    const grammar = clamp(Math.round((ab.grammar || 50) * 0.7 + coverage * 0.3), 10, 100);
    const total = Math.round(vocab * .25 + grammar * .3 + logic * .25 + delivery * .2);
    return {
      total, vocab, grammar, logic, delivery, source: "local",
      strengths: buildStrengths({ vocab, grammar, logic, delivery, coverage, avgLen }),
      risks: buildRisks({ vocab, grammar, logic, delivery, coverage, avgLen }),
      advice: buildAdvice({ vocab, grammar, logic, delivery, coverage, avgLen }),
      rewrite: " Bitte ergänzen Sie konkrete Zahlen und einen Grund mit „weil“ oder „deshalb“."
    };
  }

  function buildStrengths(d) {
    const s = [];
    if (d.coverage >= 70) s.push("问题要点覆盖完整，没有跑题");
    if (d.avgLen >= 35) s.push("回答有实质内容，信息量充足");
    if (d.logic >= 70) s.push("能使用因果或举例结构支撑观点");
    if (!s.length) s.push("能够开口表达，具备基本交流能力");
    return s;
  }
  function buildRisks(d) {
    const r = [];
    if (d.coverage < 50) r.push("有较多问题要点被略过，容易被追问打穿");
    if (d.avgLen < 22) r.push("回答过短，缺少支撑细节");
    if (d.grammar < 55) r.push("语法错误偏高，重点丢分在句法框架");
    if (d.logic < 55) r.push("缺少逻辑连接词，听起来像背答案");
    if (!r.length) r.push("个别专业术语发音还需打磨");
    return r;
  }
  function buildAdvice(d) {
    const a = ["先用 20 秒说结论，再用一个具体例子展开——这是 APS 最吃香的回答节奏。"];
    if (d.grammar < 70) a.push("把「weil / deshalb / obwohl」三个连词练到条件反射，从句语序错误能降一半。");
    if (d.logic < 70) a.push("每个回答固定套一层结构：Erstens … Zweitens … Deshalb …");
    if (d.coverage < 70) a.push("针对本题再写一遍 40 词以内的德语提纲，录音三遍直到脱稿。");
    return a;
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, Math.round(v))); }

  function safeJSON(txt) {
    if (!txt) return null;
    let s = txt.trim();
    s = s.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
    const l = s.indexOf("["), b = s.indexOf("{");
    let start = -1;
    if (l >= 0 && (b < 0 || l < b)) start = l; else if (b >= 0) start = b;
    if (start < 0) return null;
    const open = s[start], close = open === "[" ? "]" : "}";
    const end = s.lastIndexOf(close);
    if (end <= start) return null;
    try { return JSON.parse(s.slice(start, end + 1)); } catch (e) { return null; }
  }

  window.LD.LLM = { ready, chat, correct, reply, evaluateInterview, localCheck: localCheckSync, safeJSON };
})();

<script data-page-node-id="60yE0WPmAe47JJ0FzGHJYl" data-pnid-children="LGhUo1buiFqK0e7LrbdPGD">
/* LinguaDE · 轻量 SVG 图表（无外部依赖，离线可用） */
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const el = (n, attrs, children) => {
    const e = document.createElementNS(NS, n);
    Object.keys(attrs || {}).forEach(k => e.setAttribute(k, attrs[k]));
    (children || []).forEach(c => e.appendChild(c));
    return e;
  };
  const txt = (x, y, s, o) => {
    const t = el("text", Object.assign({ x, y, fill: "currentColor", "font-size": 11 }, o || {}));
    t.textContent = s; return t;
  };

  /* 折线趋势图 */
  function line(elHost, data, opt) {
    opt = opt || {};
    const W = opt.w || 520, H = opt.h || 180, pad = { l: 34, r: 12, t: 14, b: 24 };
    const vals = data.map(d => d.v);
    const max = Math.max(100, ...vals), min = 0;
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const x = i => pad.l + (data.length === 1 ? iw / 2 : i * iw / (data.length - 1));
    const y = v => pad.t + ih - (v - min) / (max - min) * ih;

    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H });
    // 网格
    for (let g = 0; g <= 4; g++) {
      const v = min + (max - min) * g / 4, yy = y(v);
      svg.appendChild(el("line", { x1: pad.l, y1: yy, x2: W - pad.r, y2: yy, stroke: "var(--line)", "stroke-width": 1 }));
      svg.appendChild(txt(pad.l - 6, yy + 3, Math.round(v), { "text-anchor": "end", opacity: .55 }));
    }
    if (vals.length) {
      const pts = data.map((d, i) => `${x(i)},${y(d.v)}`).join(" ");
      svg.appendChild(el("polyline", { points: pts, fill: "none", stroke: "var(--brand)", "stroke-width": 2, "stroke-linejoin": "round" }));
      const area = `${pad.l},${pad.t + ih} ${pts} ${x(data.length - 1)},${pad.t + ih}`;
      svg.appendChild(el("polygon", { points: area, fill: "var(--brand)", opacity: .1, stroke: "none" }));
      data.forEach((d, i) => svg.appendChild(el("circle", { cx: x(i), cy: y(d.v), r: 3, fill: "var(--brand)" })));
    } else {
      svg.appendChild(txt(W / 2, H / 2, "暂无数据", { "text-anchor": "middle", opacity: .5 }));
    }
    // x 轴标签（首/中/尾）
    [0, Math.floor((data.length - 1) / 2), data.length - 1].filter((v, i, a) => a.indexOf(v) === i && data.length).forEach(i => {
      if (data[i]) svg.appendChild(txt(x(i), H - 6, data[i].k, { "text-anchor": "middle", opacity: .55 }));
    });
    elHost.innerHTML = ""; elHost.appendChild(svg);
  }

  /* 雷达图 */
  function radar(elHost, data, opt) {
    opt = opt || {};
    const W = opt.w || 260, H = opt.h || 220, cx = W / 2, cy = H / 2 + 4, R = Math.min(W, H) / 2 - 30;
    const n = data.length;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H });
    if (!n) { elHost.innerHTML = "<div class='empty'>暂无数据</div>"; return; }
    const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
    const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];

    [0.25, 0.5, 0.75, 1].forEach(k => {
      const p = data.map((_, i) => pt(i, R * k).join(",")).join(" ");
      svg.appendChild(el("polygon", { points: p, fill: "none", stroke: "var(--line)", "stroke-width": 1 }));
    });
    data.forEach((d, i) => {
      const [ax, ay] = pt(i, R);
      svg.appendChild(el("line", { x1: cx, y1: cy, x2: ax, y2: ay, stroke: "var(--line)", "stroke-width": 1 }));
      const [lx, ly] = pt(i, R + 15);
      svg.appendChild(txt(lx, ly + 3, d.key, { "text-anchor": "middle", "font-size": 11, opacity: .7 }));
    });
    const poly = data.map((d, i) => pt(i, R * Math.max(.04, d.value / 100)).join(",")).join(" ");
    svg.appendChild(el("polygon", { points: poly, fill: "var(--brand)", opacity: .22, stroke: "var(--brand)", "stroke-width": 2 }));
    data.forEach((d, i) => {
      const [px, py] = pt(i, R * Math.max(.04, d.value / 100));
      svg.appendChild(el("circle", { cx: px, cy: py, r: 3, fill: "var(--brand)" }));
    });
    elHost.innerHTML = ""; elHost.appendChild(svg);
  }

  /* 柱状图 */
  function bars(elHost, data, opt) {
    opt = opt || {};
    const W = opt.w || 520, H = opt.h || 180, pad = { l: 30, r: 10, t: 12, b: 26 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const max = Math.max(1, ...data.map(d => d.v));
    const bw = Math.max(8, Math.min(38, iw / Math.max(1, data.length) - 8));
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H });
    data.forEach((d, i) => {
      const cx = pad.l + (i + .5) * iw / data.length;
      const h = ih * d.v / max;
      svg.appendChild(el("rect", { x: cx - bw / 2, y: pad.t + ih - h, width: bw, height: h, rx: 4, fill: d.color || "var(--brand)", opacity: .85 }));
      svg.appendChild(txt(cx, pad.t + ih - h - 4, d.v, { "text-anchor": "middle", "font-size": 10, opacity: .6 }));
      svg.appendChild(txt(cx, H - 8, d.k, { "text-anchor": "middle", "font-size": 10, opacity: .6 }));
    });
    if (!data.length) svg.appendChild(txt(W / 2, H / 2, "暂无数据", { "text-anchor": "middle", opacity: .5 }));
    elHost.innerHTML = ""; elHost.appendChild(svg);
  }

  /* 环形进度 */
  function ring(elHost, pct, opt) {
    opt = opt || {};
    const size = opt.size || 76, sw = opt.sw || 7, R = (size - sw) / 2, C = 2 * Math.PI * R;
    const svg = el("svg", { viewBox: `0 0 ${size} ${size}`, width: size, height: size });
    svg.appendChild(el("circle", { cx: size / 2, cy: size / 2, r: R, fill: "none", stroke: "var(--line-soft)", "stroke-width": sw }));
    const arc = el("circle", {
      cx: size / 2, cy: size / 2, r: R, fill: "none", stroke: opt.color || "var(--brand)",
      "stroke-width": sw, "stroke-linecap": "round", "stroke-dasharray": C,
      "stroke-dashoffset": C * (1 - Math.max(0, Math.min(1, pct / 100))), transform: `rotate(-90 ${size / 2} ${size / 2})`
    });
    svg.appendChild(arc);
    elHost.innerHTML = `<div class="ring">${svg.outerHTML}<span class="num">${pct}</span></div>`;
  }

  window.LD.Charts = { line, radar, bars, ring };
})();

    title: "能力诊断",

    render(host, ctx) {
      const done = S().diagnosed;
      answers = []; cur = 0; started = Date.now();
      host.innerHTML = `
        <div class="page-head">

          <p>覆盖词汇、语法、阅读三类共 10 题，约 5 分钟。诊断结果直接决定自适应引擎的起点难度。</p>

           <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
             <div id="diagRing"></div>

  function lastScore() { const p = JSON.parse(localStorage.getItem("linguade.diag") || "null"); return p ? p.acc : 0; }

  function renderQ(host, ctx) {
    const box = host.querySelector("#quizBox");
    if (cur >= QUESTIONS.length) return finish(box, ctx);

    ab.speaking = Math.round((ab.speaking + correct * 2) / 2);

      .map(x => ({ vocab: "词汇", grammar: "语法", reading: "阅读" })[x.k]);
    const min = acc >= 70 ? 45 : acc >= 50 ? 35 : 25;

    host.innerHTML = `
      <div class="page-head"><h1>诊断完成</h1><p>系统已根据结果重建你的能力画像与学习计划</p></div>
      <div class="grid g3">
        <div class="card card-pad stat"><div class="k">正确率</div><div class="v">${acc}<small>%</small></div><div class="s">${correct} / ${answers.length} 题</div></div>
        <div class="card card-pad stat"><div class="k">推定水平</div><div class="v">${level}</div><div class="s">目标 ${S().profile.exam}</div></div>
        <div class="card card-pad stat"><div class="k">建议每日投入</div><div class="v">${min}<small>分钟</small></div><div class="s">系统已写入设置</div></div>
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card card-pad"><h4 style="margin:0 0 10px">能力雷达</h4><div id="rd"></div></div>
        <div class="card card-pad">
          <h4 style="margin:0 0 10px">接下来的动作</h4>
          <ol style="margin:0;padding-left:18px;line-height:2;font-size:13.5px">

            <li>已为你在「单词练习」生成今日 ${Math.min(20, 10 + correct)} 词的个性化队列</li>
            <li>诊断中的错题已自动进入错题本，等待二次巩固</li>
            <li>打开「自适应计划」查看未来 28 天的日程安排</li>
          </ol>
          <div class="btn-row" style="margin-top:14px">
            <button class="btn btn-primary" id="toVocab">开始今日训练</button>
            <button class="btn" id="toPlan">查看学习计划</button>
          </div>
        </div>
      </div>`;
    S().profile.dailyMin = min; S().profile.level = level; window.LD.Store.save();
    window.LD.Charts.radar(host.querySelector("#rd"), E().radarData(), { h: 240 });
    host.querySelector("#toVocab").onclick = () => ctx.go("vocab");
    host.querySelector("#toPlan").onclick = () => ctx.go("plan");
  }

})();

</script>
<script data-page-node-id="VPhMIQqhzlnY2d7mnl5lzd" data-pnid-children="bLQY1NHR9LQ1NoJ8FwHo9c">
/* 模块 1 · 单词练习：图文卡片 + 发音 + SM-2 间隔重复 + 自适应队列 */
(function () {
  const S = () => window.LD.Store.s, E = () => window.LD.Engine;
  let queue = [], idx = 0, flipped = false, t0 = 0, done = [];

  const Mod = {
    title: "单词练习",
    desc: "到期复习 + 自适应新词，SM-2 间隔重复算法调度复习时机",
    render(host, ctx) {
      window.LD.Store.visit("vocab");
      const due = E().dueCount();
      queue = E().buildQueue(20);
      // 考试倒排：设置了考试日期时，把被压缩的到期词条提前到队首
      const examDate = S().profile.examDate;
      let examAdvance = 0;
      if (examDate) {
        const eq = E().examQueue(40, examDate);
        const extra = eq.map(x => x.w).filter(w => !queue.some(q => q.de === w));
        const extraItems = extra.map(w => E().entryOf(w, true)).filter(Boolean);
        examAdvance = extraItems.length;
        queue = extraItems.slice(0, 14).concat(queue).slice(0, 30);
      }
      idx = 0; done = [];
      if (!queue.length) {
        host.innerHTML = `<div class="card card-pad empty"><div class="big">▤</div>
          <div>今日队列为空 —— 词库共 ${(window.LD_LEX || []).length} 词已全部进入复习周期</div>
          <div class="btn-row" style="justify-content:center;margin-top:14px">
            <button class="btn btn-primary" id="resetQueue">继续复习到期词条</button></div></div>`;
        host.querySelector("#resetQueue").onclick = () => ctx.go("vocab");
        return;
      }
      host.innerHTML = `
        <div class="page-head"><h1>单词练习</h1>
          <p>今日队列 ${queue.length} 词 · 到期复习 ${due} 个 · 词库总量 ${(window.LD_LEX || []).length} 词${examDate ? ` · <span class="tag tag-blue">考试倒排已启用：${examAdvance} 词被提前</span>` : ""}</p></div>
        <div class="grid" style="grid-template-columns:1fr 260px">
          <div class="card">
            <div class="vocab-stage" id="stage"></div>
            <div class="progress-line"><i id="pg" style="width:0%"></i></div>
            <div style="padding:12px 18px 16px;display:flex;justify-content:space-between;color:var(--text-3);font-size:12.5px">
              <span id="leftHint">已学 0 / ${queue.length}</span><span id="efHint"></span>
            </div>
          </div>
          <div class="card card-pad" style="align-self:flex-start">
            <h4 style="margin:0 0 8px;font-size:13.5px">本次回顾</h4>
            <div id="recap" class="hint">完成第一张卡片后显示。</div>
            <div class="divider"><span>今日数据</span></div>
            <div id="todayBox"></div>
          </div>
        </div>`;
      paintStage(host, ctx);
      paintToday(host);
    }
  };

  function paintToday(host) {
    const s = S();
    const todayLogs = s.log.filter(l => Date.now() - l.t < 86400000 && l.type === "vocab");
    const acc = todayLogs.length ? Math.round(todayLogs.filter(l => l.ok).length / todayLogs.length * 100) : 0;
    host.querySelector("#todayBox").innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">今日作答</span><b>${todayLogs.length}</b></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">正确率</span><b>${acc}%</b></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">今日分钟</span><b>${window.LD.Store.todayMinutes()}</b></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">待复习</span><b>${E().dueCount()}</b></div>
      </div>`;
  }

  function paintStage(host, ctx) {
    const stage = host.querySelector("#stage");
    if (idx >= queue.length) return finishRound(host, ctx);
    const c = queue[idx];
    flipped = false; t0 = Date.now();
    const artHtml = c.art && c.art !== "-" ? `<span class="vocab-art">${c.art}</span>` : "";
    stage.innerHTML = `
      <div style="color:var(--text-3);font-size:12.5px">${c.lv} · ${posName(c.pos)} ${c.isDue ? "· <span class='tag tag-ok'>复习</span>" : "· <span class='tag'>新词</span>"}</div>
      <div class="vocab-word" style="margin-top:10px">${artHtml}${c.de}</div>
      <div class="vocab-phon">${phonetic(c.de)}</div>
      <div id="reveal" style="display:none;width:100%;max-width:620px">
        <div class="vocab-zh">${c.zh}</div>
        ${c.ex ? `<div class="vocab-ex"><div class="de">${c.ex}</div><div class="zh">${c.exzh}</div></div>` : ""}
      </div>
      <div class="vocab-actions">
        <button class="btn" id="flipBtn">显示释义 (空格)</button>
        <button class="btn" id="sayBtn">🔊 发音</button>
      </div>
      <div id="rate" style="display:none" class="rate-bar">
        <div class="rate-btn" data-v="0">完全不会</div>
        <div class="rate-btn" data-v="1">很吃力</div>
        <div class="rate-btn" data-v="2">想起来了</div>
        <div class="rate-btn" data-v="3">很轻松</div>
      </div>`;
    const flip = () => {
      flipped = true;
      host.querySelector("#reveal").style.display = "block";
      host.querySelector("#rate").style.display = "flex";
    };
    host.querySelector("#flipBtn").onclick = flip;
    host.querySelector("#sayBtn").onclick = () => speak(c.de);
    host._flip = flip; host._rate = null;
    [...stage.querySelectorAll(".rate-btn")].forEach(b => {
      b.onclick = () => {
        const v = +b.dataset.v, ms = Date.now() - t0;
        E().rate(c.de, v);
        const ok = v >= 2;
        window.LD.Store.logAnswer({ type: "vocab", ability: "vocab", ok, ms, item: c.de, level: c.lv, skill: "v:" + c.de });
        if (!ok) window.LD.Store.addWrong({ module: "单词", type: "vocab", wrong: c.de, right: `${c.art === "-" ? "" : c.art + " "}${c.de} — ${c.zh}`, source: c.ex || "", why: c.zh });
        done.push({ ...c, v, ms });
        idx++;
        host.querySelector("#pg").style.width = (idx / queue.length * 100) + "%";
        host.querySelector("#leftHint").textContent = `已学 ${idx} / ${queue.length}`;
        const n = E().nextDifficulty(done.map(d => ({ ok: d.v >= 2, ms: d.ms })));
        host.querySelector("#efHint").textContent = `自适应难度：L${n.level} · ${n.reason}`;
        paintRecap(host); paintToday(host);
        paintStage(host, ctx);
      };
    });
  }

  function paintRecap(host) {
    host.querySelector("#recap").innerHTML = done.slice(-6).reverse().map(d => `
      <div class="list-item" style="padding:7px 0">
        <span class="${d.v >= 2 ? "badge-v" : "badge-x"}" style="width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:${d.v >= 2 ? "var(--ok-soft)" : "var(--danger-soft)"};color:${d.v >= 2 ? "var(--ok)" : "var(--danger)"}">${d.v >= 2 ? "✓" : "✕"}</span>
        <div class="main"><div class="t1">${d.art !== "-" ? d.art + " " : ""}${d.de}</div><div class="t2">${d.zh}</div></div>
        <button class="btn btn-sm" onclick="window.LD.SpeechUtil.say('${d.de.replace(/'/g, "")}')">🔊</button>
      </div>`).join("");
  }

  function finishRound(host, ctx) {
    const st = host.querySelector("#stage");
    const okN = done.filter(d => d.v >= 2).length;
    const ms = Math.round(done.reduce((a, d) => a + d.ms, 0) / 1000);
    window.LD.Store.addSession({ module: "vocab", ms: ms * 1000, count: done.length });
    st.innerHTML = `
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:40px">✅</div>
        <h2 style="margin:10px 0 4px">本轮完成</h2>
        <div style="color:var(--text-3)">${done.length} 词 · 掌握 ${okN} · 用时 ${Math.floor(ms / 60)} 分 ${ms % 60} 秒</div>
        <div class="btn-row" style="justify-content:center;margin-top:18px">
          <button class="btn btn-primary" id="again">再来一轮</button>
          <button class="btn" id="toNote">查看错题本</button>
          <button class="btn" id="toBoard">学情分析</button>
        </div>
      </div>`;
    st.querySelector("#again").onclick = () => ctx.go("vocab");
    st.querySelector("#toNote").onclick = () => ctx.go("notebook");
    st.querySelector("#toBoard").onclick = () => ctx.go("analytics");
  }

  const posMap = { n: "名词", v: "动词", adj: "形容词", adv: "副词", conj: "连词", prep: "介词", phrase: "短语" };
  const posName = p => posMap[p] || p || "";

  /* 极简德语拼读提示（非 IPA，仅辅助初学者掌握节奏） */
  function phonetic(w) {
    if (!w) return "";
    const map = [["sch", "ʃ"], ["ch", "ç"], ["ei", "ai"], ["ie", "iː"], ["eu", "ɔy"], ["au", "au"],
      ["tz", "ts"], ["sp", "ʃp"], ["st", "ʃt"], ["ß", "s"], ["ü", "yː"], ["ö", "øː"], ["ä", "ɛː"]];
    let s = w.toLowerCase(), out = "";
    for (let i = 0; i < s.length;) {
      let hit = null;
      for (const [k, v] of map) { if (s.startsWith(k, i)) { hit = [k, v]; break; } }
      if (hit) { out += hit[1]; i += hit[0].length; }
      else { out += s[i]; i++; }
    }
    return "/" + out + "/";
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) { toast("当前浏览器不支持语音合成", "err"); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; u.rate = .92; u.pitch = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  window.LD.SpeechUtil = { say: speak, phonetic };
  window.LD.Modules = window.LD.Modules || {};
  window.LD.Modules.vocab = Mod;
  function toast(m, t) { window.LD.UI && window.LD.UI.toast(m, t); }
})();

</script>

            <div class="row">

                  ${i.fix ? ` <span style="color:var(--text-3)">→</span> <ins>${esc(i.fix)}</ins>` : ""}
                  ${!i.wrong && !i.fix ? esc(text) : ""}
                </div>
                <div class="why">${esc(i.why)}</div>
              </div>
              <span class="tag">${esc(i.type || "综合")}</span>
            </div>
          </div>`).join("")}</div>` : `<div class="card card-pad" style="margin-top:12px;background:var(--ok-soft)">
            <div style="font-size:14px">句子结构没有明显问题。若想继续打磨，可尝试用从句或被动式改写同一句话。</div></div>`}
        <div class="btn-row" style="margin-top:12px">
          <button class="btn" id="saveWrong">存入错题本</button>
          <button class="btn" id="toChat">到对话里练这句</button>

      window.LD.Charts.ring(out.querySelector("#ringBox"), score, { size: 68, color: score >= 85 ? "var(--ok)" : score >= 60 ? "var(--accent)" : "var(--danger)" });
      out.querySelector("#saveWrong").onclick = () => {

          source: "", why: issues.map(i => i.why).join("；")
        });
        toast("已存入错题本", "ok");
      };
      out.querySelector("#toChat").onclick = () => ctx.go("chat", { preset: text });
    }).catch(e => {
      out.innerHTML = `<div class="card card-pad" style="background:var(--danger-soft)">诊断失败：${esc(e.message || e)}</div>`;
    });
  }

  const typeIcon = t => ({ "语序": "⇄", "格变化": "◱", "助动词": "⟲", "正字法": "Aa", "搭配": "∞", "否定": "∅", "标点": ".", "综合": "✎", "动词框架": "⟲" }[t] || "✎");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function toast(m, t) { window.LD.UI && window.LD.UI.toast(m, t); }

<script data-page-node-id="uz0cQ8lB1exLrF4rPNMYAv" data-pnid-children="iVnOtVgjJNknNbQpzbyJR3">
/* 模块 3 · AI 德语对话：场景化角色扮演 + 语音输入 + 即时语法指正 */
(function () {
  const S = () => window.LD.Store.s;
  let sceneId = "aps", sending = false;

  const Mod = {
    title: "AI 德语对话",
    desc: "留学面试 / 校园注册 / 租房 / 同学闲聊五大场景，语音双通道输入",
    render(host, ctx) {
      window.LD.Store.visit("chat");
      const scenes = window.LD_SCENES || [];
      sceneId = (ctx.payload && ctx.payload.scene) || sceneId;
      host.innerHTML = `
        <div class="page-head"><h1>AI 德语对话</h1>
          <p>选择场景后直接开口或打字；系统会就你的句子做即时语法指正${window.LD.LLM.ready() ? "（大模型驱动）" : "（本地规则驱动）"}。</p></div>
        <div class="card" style="overflow:hidden">
          <div class="scenes" id="scenes">${scenes.map(s => `<div class="scene-chip" data-id="${s.id}">${s.name}</div>`).join("")}</div>
          <div class="chat-shell">
            <div class="chat-log" id="log"></div>
            <div class="chat-input">
              <textarea id="cIn" placeholder="用德语输入你想说的话…… Ctrl + Enter 发送"></textarea>
              <button class="btn" id="micBtn" title="语音输入（Chrome）">🎙</button>
              <button class="btn btn-primary" id="sendBtn">发送</button>
            </div>
          </div>
        </div>
        <div class="hint" style="margin-top:8px">提示：APS 场景中回答尽量给出<b>具体数字与理由</b>，审核官最忌空泛。</div>`;

      const chips = [...host.querySelectorAll(".scene-chip")];
      const activate = id => {
        sceneId = id;
        chips.forEach(c => c.classList.toggle("active", c.dataset.id === id));
        paintLog(host, ctx);
      };
      chips.forEach(c => c.onclick = () => activate(c.dataset.id));
      chips.forEach(c => c.classList.toggle("active", c.dataset.id === sceneId));

      const input = host.querySelector("#cIn");
      input.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") send(host, ctx); });
      host.querySelector("#sendBtn").onclick = () => send(host, ctx);
      host.querySelector("#micBtn").onclick = () => micInput(host, input);

      if (ctx.payload && ctx.payload.preset) input.value = ctx.payload.preset;
      paintLog(host, ctx);
    }
  };

  const scene = () => (window.LD_SCENES || []).find(s => s.id === sceneId) || window.LD_SCENES[0];

  function msgs() {
    const s = S();
    s.chats[sceneId] = s.chats[sceneId] || [{ role: "assistant", content: scene().starter, tip: "" }];
    return s.chats[sceneId];
  }

  function paintLog(host, ctx) {
    const log = host.querySelector("#log");
    log.innerHTML = msgs().map(m => {
      if (m.role === "system") return `<div class="msg system">${esc(m.content)}</div>`;
      return `<div class="msg ${m.role === "user" ? "me" : "ai"}">${esc(m.content)}${m.tip ? `<span class="tip">💡 ${esc(m.tip)}</span>` : ""}</div>`;
    }).join("");
    log.scrollTop = log.scrollHeight;
  }

  function send(host, ctx) {
    if (sending) return;
    const input = host.querySelector("#cIn");
    const text = input.value.trim();
    if (!text) return;
    const list = msgs();
    list.push({ role: "user", content: text });
    input.value = "";
    paintLog(host, ctx);
    window.LD.Store.save();

    sending = true;
    const log = host.querySelector("#log");
    log.insertAdjacentHTML("beforeend", `<div class="msg ai" id="typing">…</div>`);
    log.scrollTop = log.scrollHeight;

    // 并行：语法指正
    const checkP = window.LD.LLM.correct(text);

    window.LD.LLM.reply(scene(), list.filter(m => m.role !== "system"), text).then(async r => {
      const issues = await checkP;
      let tip = r.tip || "";
      const real = (issues.issues || []).filter(i => i && i.why);
      if (real.length) {
        const first = real[0];
        tip = (tip ? tip + " ｜ " : "") + `【${first.type || "语法"}】${first.why}`;
        real.forEach(i => window.LD.Store.addWrong({
          module: "AI 对话", type: i.type || "综合", wrong: i.wrong || text, right: i.fix || "", source: text, why: i.why
        }));
      } else if (!tip) {
        tip = "句型没有明显问题，可继续加一层细节（数字、例子、原因）让回答更有说服力。";
      }
      list.push({ role: "assistant", content: r.text, tip });
      const t = host.querySelector("#typing"); if (t) t.remove();
      paintLog(host, ctx);
      window.LD.Store.save();
      // 朗读
      try { window.LD.SpeechUtil.say(r.text.replace(/<[^>]+>/g, "")); } catch (e) { }
      window.LD.Store.logAnswer({ type: "chat", ability: "speaking", ok: real.length === 0, ms: 20000, item: sceneId, skill: "chat:" + sceneId });
      sending = false;
    }).catch(e => {
      const t = host.querySelector("#typing"); if (t) t.remove();
      toast("回复失败：" + e.message, "err");
      sending = false;
    });
  }

  function micInput(host, input) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast("当前浏览器不支持语音识别，请用 Chrome 或 Edge", "err"); return; }
    const rec = new SR();
    rec.lang = "de-DE"; rec.interim = true; rec.continuous = false;
    const btn = host.querySelector("#micBtn");
    btn.textContent = "●"; btn.style.color = "var(--danger)";
    rec.onresult = ev => {
      let txt = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
      input.value = txt;
      if (ev.results[0].isFinal) { input.value = txt.trim(); }
    };
    rec.onerror = ev => toast("识别失败：" + ev.error, "err");
    rec.onend = () => { btn.textContent = "🎙"; btn.style.color = ""; };
    rec.start();
    toast("请开始说德语……", "info");
  }

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function toast(m, t) { window.LD.UI && window.LD.UI.toast(m, t); }

  window.LD.Modules = window.LD.Modules || {};
  window.LD.Modules.chat = Mod;
})();

</script>

    } catch (e) { toast("无法启动麦克风：" + e.message, "err"); }
  }

  function stopUI(host) {
    recording = false;
    const b = host.querySelector("#micBtn");
    if (b) { b.classList.remove("recording"); b.textContent = "🎙"; }
    const h = host.querySelector("#micHint");
    if (h) h.textContent = "点击开始跟读（最多 20 秒）";
  }

  function scoreIt(host, hyp, ms, pauseN) {
    const res = E().scoreSpeech(cur.de, hyp, { ms, pauses: pauseN });
    if (!res) { toast("未能识别到有效文本", "err"); return; }
    S().ability.speaking = Math.round((S().ability.speaking * 3 + res.total) / 4);
    window.LD.Store.logAnswer({ type: "speech", ability: "speaking", ok: res.total >= 70, ms, item: cur.de, skill: "speak:" + cur.de });
    S().speeches.unshift({ t: Date.now(), ref: cur.de, hyp, ...res });
    window.LD.Store.addSession({ module: "speech", ms, count: 1 });
    if (res.total < 70) {
      window.LD.Store.addWrong({
        module: "口语测评", type: "speech", wrong: hyp, right: cur.de, source: cur.zh,
        why: `口语评分 ${res.total} 分（${res.grade}）：${res.advice[0]}`
      });
    }
    window.LD.Store.save();
    host.querySelector("#detail").innerHTML = `
      <div class="card" style="margin-top:14px;background:var(--panel-2)">
        <div class="card-pad">
          <div class="score-ring">
            <div id="spRing"></div>
            <div><div style="font-weight:600;font-size:16px">${res.total} 分 · ${res.grade}</div>
              <div style="font-size:12.5px;color:var(--text-3)">语速约 ${res.wpm} 词/分钟 · 用时 ${(ms / 1000).toFixed(1)} 秒</div></div>
          </div>
          <div class="dims">
            ${dimRows(res)}
          </div>
          <div class="divider"><span>改进建议</span></div>
          <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.9;color:var(--text-2)">
            ${res.advice.map(a => `<li>${a}</li>`).join("")}
          </ul>
        </div>
      </div>`;
    window.LD.Charts.ring(host.querySelector("#spRing"), res.total, { size: 72, color: res.total >= 70 ? "var(--ok)" : "var(--accent)" });
  }

  const dimRows = r => [
    ["准确度", r.accuracy], ["流利度", r.fluency], ["重音", r.stress], ["语调", r.intonation]
  ].map(([n, v]) => `<div class="dim-row"><div class="n">${n}</div>
      <div class="dim-bar"><i style="width:${v}%"></i></div><div class="s">${v}</div></div>`).join("");

  function toast(m, t) { window.LD.UI && window.LD.UI.toast(m, t); }

  window.LD.Modules = window.LD.Modules || {};
  window.LD.Modules.speech = Mod;
})();

</script>
<script data-page-node-id="2nKvYm0zEmZSYGDesT1nol" data-pnid-children="qG7HW4X7terPLmuKZCfqpj">
/* 模块 5 · 错题本：跨模块错题自动沉淀 → 二次重练 → 掌握标记 */
(function () {
  const S = () => window.LD.Store.s;
  let filter = "all", view = [];

  const Mod = {
    title: "错题本",
    desc: "单词、语法、口语、对话中的错题自动沉淀，支持重练与掌握标记",
    render(host, ctx) {
      window.LD.Store.visit("notebook");
      const all = S().wrong;
      const pending = all.filter(w => !w.mastered);
      view = filter === "all" ? all : filter === "pending" ? pending : all.filter(w => w.module === filter);
      const mods = [...new Set(all.map(w => w.module))];
      host.innerHTML = `
        <div class="page-head"><h1>错题本</h1>
          <p>共 ${all.length} 条记录 · 待掌握 ${pending.length} 条${pending.length ? " · 连续答对 2 次后可自动标记掌握" : ""}</p></div>
        <div class="grid g4" style="margin-bottom:14px">
          <div class="card card-pad stat"><div class="k">总错题</div><div class="v">${all.length}</div></div>
          <div class="card card-pad stat"><div class="k">待掌握</div><div class="v" style="color:var(--danger)">${pending.length}</div></div>
          <div class="card card-pad stat"><div class="k">已掌握</div><div class="v" style="color:var(--ok)">${all.length - pending.length}</div></div>
          <div class="card card-pad stat"><div class="k">本周新增</div><div class="v">${all.filter(w => Date.now() - w.t < 604800000).length}</div></div>
        </div>
        <div class="scenes" style="padding:0;margin-bottom:12px;border:none">
          ${[["all", "全部"], ["pending", "待掌握"]].concat(mods.map(m => [m, m])).map(([k, n]) =>
            `<div class="scene-chip ${filter === k ? "active" : ""}" data-k="${k}">${n}</div>`).join("")}
        </div>
        <div class="card">
          <div class="card-pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:12px">
            <button class="btn btn-primary" id="trainBtn">开始错题重练（${pending.length}）</button>
            <button class="btn" id="clearMastered">清理已掌握</button>
            <span class="hint" style="margin:0">重练时答对即计入一次，答错则重新计数。</span>
          </div>
          <div id="list"></div>
        </div>`;

      [...host.querySelectorAll(".scene-chip")].forEach(c => c.onclick = () => { filter = c.dataset.k; ctx.go("notebook"); });
      host.querySelector("#trainBtn").onclick = () => startTrain(host, ctx);
      host.querySelector("#clearMastered").onclick = () => {
        S().wrong = S().wrong.filter(w => !w.mastered);
        window.LD.Store.save(); toast("已清理", "ok"); ctx.go("notebook");
      };
      paintList(host, ctx);
    }
  };

  function paintList(host, ctx) {
    const box = host.querySelector("#list");
    if (!view.length) { box.innerHTML = `<div class="empty"><div class="big">✕</div>还没有错题记录 —— 去「单词练习」或「句法纠错」里跑一轮试试</div>`; return; }
    box.innerHTML = view.map(w => `
      <div class="list-item" data-id="${w.id}">
        <div class="main">
          <div class="t1">${esc(w.wrong || "—")} ${w.right ? `<span style="color:var(--text-3)">→</span> <span style="color:var(--ok)">${esc(w.right)}</span>` : ""}</div>
          <div class="t2">${esc(w.why || "")}</div>
          <div style="margin-top:6px">
            <span class="tag">${esc(w.module)}</span> <span class="tag">${esc(w.type || "综合")}</span>
            <span class="tag">重练 ${w.times || 0} 次</span>
            <span class="tag ${w.mastered ? "tag-ok" : "tag-warn"}">${w.mastered ? "已掌握" : "待掌握"}</span>
            <span style="font-size:11.5px;color:var(--text-3);margin-left:4px">${new Date(w.t).toLocaleString("zh-CN")}</span>
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          ${w.module === "单词" ? `<button class="btn btn-sm" data-say="${esc(w.wrong)}">🔊</button>` : ""}
          <button class="btn btn-sm" data-ok="${w.id}">答对了</button>
          <button class="btn btn-sm" data-bad="${w.id}">还不会</button>
        </div>
      </div>`).join("");
    box.querySelectorAll("[data-say]").forEach(b => b.onclick = () => window.LD.SpeechUtil.say(b.dataset.say));
    box.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => { window.LD.Store.reviewWrong(b.dataset.ok, true); toast("记录一次掌握，两次即自动出师", "ok"); ctx.go("notebook"); });
    box.querySelectorAll("[data-bad]").forEach(b => b.onclick = () => { window.LD.Store.reviewWrong(b.dataset.bad, false); toast("已重新计数，继续保持", "info"); ctx.go("notebook"); });
  }

  /* 错题重练：卡片式，正面 wrong/提示，翻面显示 right + 讲解 */
  function startTrain(host, ctx) {
    const pending = S().wrong.filter(w => !w.mastered);
    if (!pending.length) { toast("当前没有待掌握的错题", "info"); return; }
    const stack = pending.slice(0, 20);
    let i = 0;
    const card = stack[0];
    host.innerHTML = `
      <div class="page-head"><h1>错题重练</h1><p>共 ${stack.length} 条 · 回想答案后再翻面核对</p></div>

        <div style="padding:12px 18px;color:var(--text-3);font-size:12.5px"><span id="tHint">1 / ${stack.length}</span></div>
      </div>`;
    paint(stack[i], i, host, ctx, stack);
  }

  function paint(w, i, host, ctx, stack) {
    const st = host.querySelector("#tStage");
    st.innerHTML = `
      <div style="color:var(--text-3);font-size:12.5px;margin-bottom:8px"><span class="tag">${esc(w.module)}</span> <span class="tag">${esc(w.type || "")}</span></div>
      <div class="vocab-word" style="font-size:26px;text-align:center;line-height:1.5;max-width:600px">${esc(w.source || w.wrong)}</div>
      ${w.source ? `<div class="vocab-phon">原句语境</div>` : ""}
      <div id="tRev" style="display:none;width:100%;max-width:620px;text-align:center">
        <div class="vocab-zh" style="color:var(--ok)">${esc(w.right || "（见讲解）")}</div>
        ${w.why ? `<div class="vocab-ex"><div class="zh">${esc(w.why)}</div></div>` : ""}
      </div>
      <div class="vocab-actions">
        <button class="btn" id="tFlip">翻面核对</button>
        ${w.module === "单词" ? `<button class="btn" id="tSay">🔊</button>` : ""}
      </div>
      <div class="rate-bar" id="tRate" style="display:none">
        <div class="rate-btn" data-v="bad">还想不起来</div>
        <div class="rate-btn" data-v="ok">已经掌握了</div>
      </div>`;
    st.querySelector("#tFlip").onclick = () => { st.querySelector("#tRev").style.display = "block"; st.querySelector("#tRate").style.display = "flex"; };
    const sayB = st.querySelector("#tSay"); if (sayB) sayB.onclick = () => window.LD.SpeechUtil.say(w.wrong);
    [...st.querySelectorAll(".rate-btn")].forEach(b => b.onclick = () => {
      const ok = b.dataset.v === "ok";
      window.LD.Store.reviewWrong(w.id, ok);
      window.LD.Store.logAnswer({ type: w.type || "综合", ability: "grammar", ok, ms: 8000, item: w.wrong });
      i++;
      host.querySelector("#tPg").style.width = (i / stack.length * 100) + "%";
      if (i >= stack.length) {
        window.LD.Store.addSession({ module: "notebook", ms: stack.length * 9000, count: stack.length });
        st.innerHTML = `<div style="text-align:center;padding:20px 0"><div style="font-size:40px">🎯</div>
          <h2 style="margin:10px 0">重练完成</h2><div style="color:var(--text-3)">共 ${stack.length} 条</div>
          <div class="btn-row" style="justify-content:center;margin-top:16px">
            <button class="btn btn-primary" id="backNote">返回错题本</button></div></div>`;
        st.querySelector("#backNote").onclick = () => ctx.go("notebook");
        return;
      }
      host.querySelector("#tHint").textContent = `${i + 1} / ${stack.length}`;
      paint(stack[i], i, host, ctx, stack);
    });
  }

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function toast(m, t) { window.LD.UI && window.LD.UI.toast(m, t); }

  window.LD.Modules = window.LD.Modules || {};
  window.LD.Modules.notebook = Mod;
})();

</script>

<script data-page-node-id="7pfPTdVmf3Jt6xJ74l3UH2" data-pnid-children="HH0xAF6HrM1NLJPOlZgG3I">
