        `<div class="scene-chip ${mode === k ? "active" : ""}" data-m="${k}">${n}</div>`).join("")}
            <button class="btn btn-primary" id="startBtn" style="margin-left:auto">开始面试（5 题）</button>
          </div>
        </div>
        <div id="stage"></div>

      [...host.querySelectorAll("[data-m]")].forEach(c => c.onclick = () => { mode = c.dataset.m; paintHome(host, ctx); });

  function paintHome(host, ctx) {
    host.querySelectorAll("[data-m]").forEach(c => c.classList.toggle("active", c.dataset.m === mode));
    const hist = S().interviews;
    const host2 = host.querySelector("#history");
    host2.innerHTML = `
      <div class="card card-pad" style="margin-top:14px">
        <h4 style="margin:0 0 10px;font-size:13.5px">历史面试记录（${hist.length}）</h4>
        ${hist.length ? `<table class="tbl"><thead><tr><th>时间</th><th>类型</th><th>题量</th><th>总分</th><th>操作</th></tr></thead><tbody>
          ${hist.slice(0, 8).map(h => `<tr><td>${new Date(h.t).toLocaleString("zh-CN")}</td>

            <td>${h.count}</td><td><b style="color:${h.total >= 75 ? "var(--ok)" : h.total >= 60 ? "var(--warn)" : "var(--danger)"}">${h.total}</b></td>
            <td><button class="btn btn-sm" data-view="${h.t}">查看报告</button></td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">还没有面试记录 —— 第一次模拟大约需要 10 分钟</div>`}
      </div>`;
    host2.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
      const rec = hist.find(h => h.t === +b.dataset.view); if (rec) showReport(host, ctx, rec.report, rec);
    });
  }

  function start(host, ctx) {
    list = bank().slice(0, 5);
    idx = 0; answers = []; t0 = Date.now();
    paintQuestion(host, ctx);
  }

  function paintQuestion(host, ctx) {
    const stage = host.querySelector("#stage");
    if (idx >= list.length) return finish(host, ctx);

    const keywords = keywordsOf(curQ);
    stage.innerHTML = `
      <div class="card card-pad">

        <div class="iv-q"><div class="de">${curQ.q}</div><div class="zh">${curQ.zh}</div></div>
        <div class="hint" style="margin-top:10px">💡 ${curQ.hint}</div>
        <textarea id="aIn" style="margin-top:12px" placeholder="用德语作答。写完后可点「评分要点」自检是否覆盖：${keywords.map(k => k.replace(/\|/g, "/")).join("、")}"></textarea>

      </div>`;
    const input = stage.querySelector("#aIn");

      const a = input.value.trim();
      answers.push({ q: curQ.q, zh: curQ.zh, a, keywords, cid: curQ.id });

    stage.querySelector("#dictate").onclick = () => dictate(input);
    stage.querySelector("#giveup").onclick = () => { answers.push({ q: curQ.q, zh: curQ.zh, a: "", keywords, cid: curQ.id }); idx++; paintQuestion(host, ctx); };
  }

  function keywordsOf(q) {
    // 从参考答案中提取德文实词作为覆盖度关键词
    const stop = new Set(["ich", "die", "der", "das", "und", "ist", "bin", "habe", "weil", "für", "in", "mit", "zu", "von", "auf", "eine", "einen", "einem", "sehr", "auch", "mir", "mich", "sich", "dass", "war", "im", "am", "an", "es", "sie", "er", "man", "nicht", "noch", "schon", "gern"]);
    return (q.sample || "").toLowerCase().replace(/[.,!?;:]/g, "").split(/\s+/)
      .filter(w => w.length > 3 && !stop.has(w)).slice(0, 8);
  }

  function dictate(input) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast("浏览器不支持语音识别", "err"); return; }
    const rec = new SR(); rec.lang = "de-DE"; rec.continuous = true; rec.interimResults = true;
    let acc = "";
    rec.onresult = ev => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) acc += ev.results[i][0].transcript + " ";
      }
      input.value = acc.trim();
    };
    rec.onend = () => toast("录音结束", "ok");
    rec.onerror = e => toast("识别失败：" + e.error, "err");
    rec.start();
    toast("请开始回答……（说完点击页面空白处结束）", "info");
  }

            <div style="font-weight:600;font-size:17px">面试评估报告 · ${ rec && rec.mode === "aps" ? "APS 面谈" : rec && rec.mode === "zulassung" ? "入学面试" : "混合模拟"}</div>
            <div style="color:var(--text-3);font-size:12.5px;margin-top:3px">共 ${rec ? rec.count : "-"} 题 · 评估引擎：${rep.source === "llm" ? "大模型" : "本地规则"}</div>

            <div class="dim-bar"><i style="width:${v}%"></i></div><div class="s">${v}</div></div>`).join("")}
        </div>
        <div class="grid g2" style="margin-top:16px">
          <div class="report-sec"><h4>✅ 表现亮点</h4>${(rep.strengths || []).map(s => `<p>· ${s}</p>`).join("")}</div>
          <div class="report-sec"><h4>⚠️ 主要风险</h4>${(rep.risks || []).map(s => `<p>· ${s}</p>`).join("")}</div>
        </div>
        <div class="report-sec"><h4>🎯 针对性改进建议</h4>${(rep.advice || []).map(s => `<p>· ${s}</p>`).join("")}</div>
        ${rep.rewrite ? `<div class="report-sec"><h4>✍️ 改写示范</h4><p class="de" style="font-size:14.5px">${rep.rewrite}</p></div>` : ""}
        <div class="btn-row" style="margin-top:14px">

        <h4 style="margin:0 0 10px;font-size:13.5px">本题逐题回顾</h4>
        ${(rec.items || []).map(it => `<div class="list-item" style="align-items:flex-start">
          <div class="main"><div class="t1" style="font-size:13px">Q：${it.q}</div>
          <div class="t2" style="white-space:normal">A：${it.a || "（未作答）"}</div></div>

  window.LD.Modules.interview = Mod;

    { p: "zu", zh: "去（某处）", k: "D", tip: "zu 支配第三格" },
    { p: "nach", zh: "去（城市/国家）；之后", k: "D", tip: "nach 支配第三格" },
    { p: "aus", zh: "从…出来；来自", k: "D", tip: "aus 支配第三格" },

    { p: "um", zh: "围绕；在…点（时间）", k: "A", tip: "um 支配第四格" },
    { p: "gegen", zh: "反对；朝", k: "A", tip: "gegen 支配第四格" },
    { p: "in", zh: "在…里 / 进入", k: "A/D", tip: "双向介词：静态（wo?）第三格，方向（wohin?）第四格" },
    { p: "an", zh: "在…旁 / 到…旁", k: "A/D", tip: "双向介词：静三动四" },
    { p: "auf", zh: "在…上 / 到…上", k: "A/D", tip: "双向介词：静三动四" },
    { p: "unter", zh: "在…下 / 到…下", k: "A/D", tip: "双向介词：静三动四" },
    { p: "über", zh: "在…上方 / 越过", k: "A/D", tip: "双向介词：静三动四" },
    { p: "neben", zh: "在…旁边", k: "A/D", tip: "双向介词：静三动四" },
    { p: "wegen", zh: "由于", k: "G", tip: "书面语支配第二格" },
    { p: "trotz", zh: "尽管", k: "G", tip: "支配第二格" },

  ];

  const TYPES = {
    art: { nm: "冠词性别", ic: "◉" },
    verb: { nm: "动词变位", ic: "⟲" },
    prep: { nm: "介词支配格", ic: "⊕" }
  };

  let type = "art", stack = [], i = 0, t0 = 0, combo = 0, best = 0, right = 0, wrong = 0, msSum = 0, finished = false;

  const Mod = {

        <div class="scenes" style="padding:0;margin-bottom:14px;border:none">
          ${Object.keys(TYPES).map(k => `<div class="scene-chip ${type === k ? "active" : ""}" data-t="${k}">${TYPES[k].ic} ${TYPES[k].nm}</div>`).join("")}
        </div>
        <div class="grid" style="grid-template-columns:1fr 260px">
          <div class="card card-pad" id="quiz"></div>
          <div class="card card-pad" style="align-self:flex-start">
            <h4 style="margin:0 0 10px;font-size:13.5px">${TYPES[type].nm} · 规则要点</h4>
            <div id="cheat" style="font-size:12.5px;line-height:1.9;color:var(--text-2)"></div>
            <div class="divider"><span>本轮战绩</span></div>
            <div id="board"></div>

  function cheatSheet(t) {
    if (t === "art") return `
      <div>· <b>-ung / -heit / -keit / -tion / -schaft</b> → die</div>
      <div>· <b>-chen / -lein / -ment / -um</b> → das</div>
      <div>· <b>-er / -ismus / -ling</b>（人或工具）→ der</div>
      <div>· 四季、月份、星期、方位 → der</div>
      <div class="hint">训练题由真实词库生成，共 ${articlePool().length} 个名词。</div>`;
    if (t === "verb") return `
      <div>· 强动词现在时第二/三人称单数常发生<b>元音变化</b>（e→i/ie，a→ä）</div>
      <div>· fahren → er <b>fährt</b>；essen → er <b>isst</b>；geben → er <b>gibt</b></div>
      <div>· 位移动词完成时用 <b>sein</b>，其余多用 haben</div>
      <div class="hint">共 ${VERBS.length} 个高频动词。</div>`;
    return `
      <div>· <b>静三动四</b>：in / an / auf / unter / über / neben / vor / hinter</div>
      <div>· <b>永远第三格</b>：mit / bei / von / zu / nach / aus / seit</div>

  }

  function build(t) {
    const out = [];
    if (t === "art") {
      articlePool().forEach(n => {
        out.push({
          q: `${n.de}`, sub: n.zh, a: n.a, opts: ["der", "die", "das"], ex: n.ex,
          why: `「${n.de}」= ${n.a} ${n.de}（${n.zh}）`,
          skill: "art:" + n.de
        });
      });
    } else if (t === "verb") {
      VERBS.forEach(v => {
        const pi = Math.floor(Math.random() * 6);
        out.push({
          q: `${PRON[pi]}  ______   （原形 ${v.inf}）`, sub: `${v.zh} · 现在时变位`,
          a: v.pr[pi], opts: shuffleUnique([v.pr[pi], v.pr[(pi + 1) % 6], v.inf, v.part]),
          why: `${PRON[pi]} + ${v.inf} → ${v.pr[pi]}`,
          skill: "verb:" + v.inf
        });
        out.push({
          q: `完成时：er  ______  ${v.part}`, sub: `${v.zh} · 助动词选择`,
          a: v.perf, opts: ["hat", "ist"],
          why: `${v.inf} 完成时助动词为 ${v.aux}：er ${v.perf} ${v.part}`,
          skill: "aux:" + v.inf
        });
      });
    } else {
      PREPS.forEach(p => {
        out.push({
          q: `${p.p}  ______   （${p.zh}）`, sub: "这个介词支配第几格？",
          a: p.k, opts: p.k === "A/D" ? ["A", "D", "A/D", "G"] : ["A", "D", "G"],
          why: p.tip, skill: "prep:" + p.p
        });
      });
    }
    return shuffle(out).slice(0, 40);
  }

  function shuffleUnique(arr) {
    const keep = arr[0];
    const s = [...new Set(arr)];
    while (s.length < 4) s.push(["-er", "-e", "-t", "-st"][s.length % 4]);
    let out = shuffle(s).slice(0, 4);
    if (!out.includes(keep)) out[0] = keep;
    return shuffle(out);
  }
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };

  function paint(host, ctx) {
    const box = host.querySelector("#quiz");
    if (finished || i >= stack.length) return finish(box, ctx);
    const q = stack[i]; t0 = Date.now();

          if (v === o && !ok) c.style.background = "var(--danger-soft)";
        });
        if (ok) { right++; combo++; } else { wrong++; combo = 0; }
        best = Math.max(best, combo);
        window.LD.Store.logAnswer({ type: "drill", ability: "grammar", ok, ms, item: q.q, skill: q.skill });
        if (!ok) window.LD.Store.addWrong({ module: "专项训练", type: TYPES[type].nm, wrong: q.q, right: q.a, source: q.sub, why: q.why });
        box.querySelector("#fb").innerHTML = `
          <div class="corr-item" style="margin-top:12px"><div class="row">
            <span class="${ok ? "badge-v" : "badge-x"}">${ok ? "✓" : "✕"}</span>
            <div><div style="font-size:13.5px">${q.why}</div>
            <div class="why">BKT 掌握概率 ${Math.round(E().bktState(q.skill) * 100)}% · 预测下次正确率 ${E().bktPredict(q.skill)}%</div></div>
          </div></div>
          <div style="margin-top:10px;text-align:right"><button class="btn btn-primary" id="next">${i + 1 >= stack.length ? "查看结果" : "下一题"}</button></div>`;
        box.querySelector("#next").onclick = () => { i++; paint(host, ctx); paintBoard(host); };
        paintBoard(host);
      };
      oBox.appendChild(b);
    });
  }

  function paintBoard(host) {
    const b = host.querySelector("#board");
    if (!b) return;
    const total = right + wrong;
    b.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">

        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">最高连击</span><b>${best}</b></div>

        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">平均反应</span><b>${total ? Math.round(msSum / total) : 0} ms</b></div>
      </div>`;
  }

  function finish(box, ctx) {
    finished = true;
    const total = right + wrong;
    window.LD.Store.addSession({ module: "drill", ms: msSum, count: total });
    box.innerHTML = `<div style="text-align:center;padding:26px 0">
      <div style="font-size:40px">${right / Math.max(1, total) >= .8 ? "🏆" : "💪"}</div>

      <div style="color:var(--text-3)">${total} 题 · 正确 ${right} · 最高连击 ${best} · 平均 ${Math.round(msSum / Math.max(1, total))} ms</div>

    box.querySelector("#again").onclick = () => ctx.go("drill");
    box.querySelector("#toNote").onclick = () => ctx.go("notebook");
  }

  window.LD.Modules = window.LD.Modules || {};
  window.LD.Modules.drill = Mod;
})();

</script>

      };
      st.querySelector("#rec").onclick = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { toast("浏览器不支持语音识别，请手动输入", "err"); return; }

        rec.onresult = ev => {
          let inter = "";
          for (let k = ev.resultIndex; k < ev.results.length; k++) {
            const t = ev.results[k][0].transcript;
            if (ev.results[k].isFinal) acc += t + " "; else inter += t;
          }
          st.querySelector("#tr").innerHTML = `<div>${acc}<span style="color:var(--text-3)">${inter}</span></div>`;

      `评分 ${res.total} 分（${res.grade}）· 准确度 ${res.accuracy} · 流利度 ${res.fluency}｜原句：${cur.de}`, "listening");

  function judge(st, host, ctx, ok, whyText, ability) {
    right += ok ? 1 : 0; wrong += ok ? 0 : 1;
    window.LD.Store.logAnswer({ type: ability || "listening", ability: ability === "listening" ? "listening" : "listening", ok, ms: 9000, item: cur.de, skill: "hear:" + cur.key });

    st.querySelector("#fb").innerHTML = `
      <div class="corr-item" style="margin-top:14px"><div class="row">
        <span class="${ok ? "badge-v" : "badge-x"}">${ok ? "✓" : "✕"}</span>
        <div><div style="font-size:13.5px">${whyText}</div>
        <div class="why">按 Enter 或点击按钮进入下一题</div></div>
      </div></div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn btn-primary" id="next">下一题</button>
        <button class="btn" id="again">再听一遍</button>
      </div>`;
    st.querySelector("#next").onclick = () => { i++; paint(host, ctx); paintBoard(host); };
    st.querySelector("#again").onclick = () => window.LD.SpeechUtil.say(cur.de, rate);
    paintBoard(host);
  }

  function paintBoard(host) {
    const b = host.querySelector("#board");
    if (!b) return;
    const t = right + wrong;
    b.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">已练</span><b>${t} / ${stack.length}</b></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">正确率</span><b>${t ? Math.round(right / t * 100) : 0}%</b></div>
      </div>`;
  }

  function finish(st, ctx) {
    finished = true;
    window.LD.Store.addSession({ module: "listening", ms: stack.length * 20000, count: stack.length });
    st.innerHTML = `<div style="text-align:center;padding:26px 0">
      <div style="font-size:40px">🎧</div>
      <h2 style="margin:10px 0 4px">听力训练完成</h2>
      <div style="color:var(--text-3)">共 ${stack.length} 题 · 正确 ${right} · 错误 ${wrong}</div>
      <div class="btn-row" style="justify-content:center;margin-top:16px">
        <button class="btn btn-primary" id="again2">再来一组</button>
        <button class="btn" id="toSpeech">去口语测评</button></div></div>`;
    st.querySelector("#again2").onclick = () => ctx.go("listening");
    st.querySelector("#toSpeech").onclick = () => ctx.go("speech");
  }

  const escapeRe = s => (s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  function toast(m, t) { window.LD.UI && window.LD.UI.toast(m, t); }

  window.LD.Modules = window.LD.Modules || {};
  window.LD.Modules.listening = Mod;
})();

</script>

      "zuerst", "dann", "schließlich", "zusammenfassend", "erstens", "zweitens"];
    const conCount = connectives.reduce((a, c) => a + (text.toLowerCase().match(new RegExp("\\b" + c + "\\b", "g")) || []).length, 0);
    const coherence = clamp(Math.round(40 + conCount / Math.max(1, sents.length) * 55), 20, 100);

    // 词汇：型例比（type-token ratio）+ 形容词副词占比
    const uniq = new Set(words.map(w => w.toLowerCase().replace(/[.,;:!?]/g, "")));
    const ttr = uniq.size / Math.max(1, words.length);
    const vocab = clamp(Math.round(ttr * 140 + Math.min(30, uniq.size * 0.35)), 25, 100);

    // 语法：逐句走规则引擎，统计问题密度
    let issues = [], bad = 0;
    sents.forEach(s => {
      const r = window.LD.LLM.localCheck(s + ".");
      const real = (r || []).filter(i => i && i.why);
      if (real.length) { bad++; issues.push({ sentence: s.slice(0, 90), why: real[0].why, fix: real[0].fix || "" }); }
    });
    const grammar = clamp(Math.round(100 - bad / Math.max(1, sents.length) * 130), 20, 100);

    const total = Math.round(taskScore * .3 + coherence * .2 + vocab * .2 + grammar * .3);

    return {
      source: "local", total, task: taskScore, coherence, vocab, grammar,
      strengths: buildStrengths({ taskScore, coherence, vocab, grammar, words: words.length, conCount, taskMin: task.min }),
      issues: issues.slice(0, 6),
      advice: buildAdvice({ taskScore, coherence, vocab, grammar, words: words.length, conCount }),
      rewrite: issues.length ? issues[0].fix ? `${issues[0].sentence} → ${issues[0].fix}` : "建议重写首句，确保谓语动词位置正确。" : ""
    };
  }

  function buildStrengths(d) {
    const s = [];
    if (d.words >= d.taskMin) s.push(`字数达到 ${d.words} 词，篇幅达标`);
    if (d.conCount >= 4) s.push(`使用了 ${d.conCount} 处连接词，行文连贯`);
    if (d.vocab >= 70) s.push("词汇有一定多样性，避免大量重复");
    if (d.grammar >= 70) s.push("多数句子句法框架正确");
    if (!s.length) s.push("能够完成写作任务，具备基本表达能力");
    return s;
  }
  function buildAdvice(d) {
    const a = [];
    if (d.taskScore < 70) a.push("对照评分要点逐条检查，确保每个要点都在文中明确出现。");
    if (d.conCount < 4) a.push("增加 deshalb / außerdem / einerseits … andererseits 等连接词，提升连贯性得分。");
    if (d.vocab < 70) a.push("替换重复用词：把 gut 换成 sinnvoll / angemessen / vorteilhaft。");
    if (d.grammar < 70) a.push("重点检查动词位置与完成时助动词，这两类是扣分重灾区。");
    if (!a.length) a.push("整体达标，建议限时重做一遍以训练考试节奏。");
    return a;
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, Math.round(v)));

  function reportHTML(r) {
    const dims = [["任务完成度", r.task], ["连贯性", r.coherence], ["词汇", r.vocab], ["语法", r.grammar]];
    lastReport = r;
    return `
      <div class="card" style="margin-top:14px;background:var(--panel-2)">
        <div class="card-pad">
          <div class="score-ring">
            <div id="wRing"></div>
            <div><div style="font-weight:600;font-size:16px">${r.total} 分 · ${grade(r.total)}</div>
              <div style="font-size:12.5px;color:var(--text-3)">批改引擎：${r.source === "llm" ? "大模型精细批注" : "本地规则引擎"}</div></div>
          </div>
          <div class="dims">
            ${dims.map(([n, v]) => `<div class="dim-row"><div class="n">${n}</div>
              <div class="dim-bar"><i style="width:${v}%"></i></div><div class="s">${v}</div></div>`).join("")}
          </div>
          ${(r.strengths || []).length ? `<div class="report-sec"><h4>✅ 表现亮点</h4>${r.strengths.map(s => `<p>· ${s}</p>`).join("")}</div>` : ""}
          ${(r.issues || []).length ? `<div class="report-sec"><h4>✎ 逐句批注</h4>
            ${r.issues.map(i => `<div class="corr-item" style="margin-top:8px"><div class="row">
              <span class="badge-x">✕</span><div style="flex:1">
              <div style="font-size:13.5px">${esc(i.sentence)}</div>
              <div class="why">${esc(i.why)}${i.fix ? " ｜ 建议：" + esc(i.fix) : ""}</div></div></div></div>`).join("")}</div>` : ""}
          <div class="report-sec"><h4>🎯 改进建议</h4>${(r.advice || []).map(s => `<p>· ${esc(s)}</p>`).join("")}</div>
          ${r.rewrite ? `<div class="report-sec"><h4>✍️ 改写示范</h4><p class="de" style="font-size:14px;line-height:1.8">${esc(r.rewrite)}</p></div>` : ""}
          <div class="btn-row" style="margin-top:12px">
            <button class="btn" id="saveW">存入错题本</button>
            <button class="btn" id="sample2">对照范文</button>
          </div>
        </div>
      </div>`;
  }

  function bindReport(out, host, text) {
    window.LD.Charts.ring(out.querySelector("#wRing"), lastReport.total,
      { size: 72, color: lastReport.total >= 75 ? "var(--ok)" : lastReport.total >= 60 ? "var(--accent)" : "var(--danger)" });
    window.LD.Store.logAnswer({
      type: "writing", ability: "writing", ok: lastReport.total >= 70, ms: 120000,
      item: curTask.title, skill: "write:" + curTask.id
    });
    window.LD.Store.addSession({ module: "writing", ms: 300000, count: 1 });
    (lastReport.issues || []).forEach(i => window.LD.Store.addWrong({
      module: "写作批改", type: "写作", wrong: i.sentence, right: i.fix || "", source: curTask.title, why: i.why
    }));
    out.querySelector("#saveW").onclick = () => {
      window.LD.Store.addWrong({
        module: "写作批改", type: "写作", wrong: text.slice(0, 200), right: curTask.sample.slice(0, 200),
        source: curTask.title, why: `总分 ${lastReport.total}｜` + (lastReport.advice || []).join("；")
      });
      toast("已存入错题本", "ok");
    };
    out.querySelector("#sample2").onclick = () => {
      out.insertAdjacentHTML("beforeend", `
        <div class="card card-pad" style="margin-top:12px">
          <div style="font-size:12px;color:var(--text-3);margin-bottom:8px">参考范文</div>
          <div class="de" style="font-size:14px;line-height:1.9;white-space:pre-wrap">${esc(curTask.sample)}</div>
        </div>`);
    };
  }

  const grade = t => t >= 85 ? "优秀" : t >= 72 ? "良好" : t >= 60 ? "合格" : "需加强";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function toast(m, t) { window.LD.UI && window.LD.UI.toast(m, t); }

  window.LD.Modules = window.LD.Modules || {};
  window.LD.Modules.writing = Mod;
})();

</script>
<script data-page-node-id="57tOYz28JbNVIm2RXXnvoJ" data-pnid-children="AnOrRqjpbTiMp1JDaUrs5r">
/* 模块 12 · 句法透视：把德语句子拆解为成分并标注格与动词框架
   借鉴开源项目 lingolift 的 "syntax breakdown" 思路 —— 让学习者看到句子骨架，
   而不是只被告知"错了"。德语语序与格变化是中国学生的两大盲区，可视化拆解直击痛点。 */
(function () {
  const S = () => window.LD.Store.s;

  /* 冠词 / 代词 → 格与性 的映射表 */
  const ART = {
    der: { c: "N", g: "m" }, die: { c: "N/A", g: "f" }, das: { c: "N/A", g: "n" },
    den: { c: "A", g: "m" }, dem: { c: "D", g: "m/n" }, des: { c: "G", g: "m/n" },
    ein: { c: "N", g: "m/n" }, eine: { c: "N/A", g: "f" }, einen: { c: "A", g: "m" },
    einem: { c: "D", g: "m/n" }, einer: { c: "D/G", g: "f" },
    ich: { c: "N" }, du: { c: "N" }, er: { c: "N" }, sie: { c: "N/A" }, es: { c: "N/A" },
    wir: { c: "N" }, ihr: { c: "N/D" }, mir: { c: "D" }, dich: { c: "A" },
    mich: { c: "A" }, uns: { c: "A/D" }, euch: { c: "A/D" }, ihm: { c: "D" }, ihn: { c: "A" }
  };
  const PREP_A = ["für", "ohne", "durch", "um", "gegen", "bis"];
  const PREP_D = ["mit", "bei", "von", "zu", "nach", "aus", "seit", "gegenüber"];
  const PREP_AD = ["in", "an", "auf", "unter", "über", "neben", "vor", "hinter", "zwischen"];
  const PREP_G = ["wegen", "trotz", "während", "statt", "dank"];
  const SUBJUNCT = ["weil", "obwohl", "dass", "wenn", "falls", "ob", "nachdem", "bevor", "damit", "sodass", "während", "als", "sobald"];
  const AUX = ["habe", "hat", "haben", "bin", "ist", "sind", "war", "waren", "werde", "wird", "werden",
    "kann", "kannst", "können", "muss", "musst", "müssen", "will", "willst", "wollen",
    "soll", "sollst", "sollen", "darf", "darfst", "dürfen", "möchte", "möchtest", "mag"];
  const NAMES = ["Subjekt", "Prädikat", "Objekt", "Adverbial", "Präpositional", "Konjunktion", "Nebensatz", "Attribut"];

  const ROLE_COLOR = {
    "主语": "#1668dc", "谓语": "#e05252", "宾语": "#18a058", "状语": "#f0a020",
    "介词短语": "#2bb0c9", "连词": "#8e44ad", "从句": "#8e44ad", "定语": "#7a7a7a", "其他": "#9aa3b2"
  };

  const SAMPLES = [
    "Ich bin gestern mit dem Bus zur Universität gefahren.",
    "Weil ich keine Zeit habe, kann ich heute nicht kommen.",
    "Der Student schreibt seiner Professorin eine lange E-Mail.",
    "Obwohl das Wetter schlecht ist, gehen wir spazieren.",
    "Ich interessiere mich für die deutsche Geschichte."
  ];

  let cur = SAMPLES[0];

  const Mod = {
    title: "句法透视",
    desc: "句子成分拆解 + 格标记 + 动词框架可视化，直击德语语序与格变化盲区",
    render(host, ctx) {
      window.LD.Store.visit("syntax");
      host.innerHTML = `
        <div class="page-head"><h1>句法透视</h1>
          <p>输入或选择一句德语，系统拆解为主语 / 谓语 / 宾语 / 状语 / 介词短语 / 从句，并标注格与动词框架。</p></div>
        <div class="grid" style="grid-template-columns:1fr 300px">
          <div class="card card-pad">
            <textarea id="sIn" style="min-height:76px">${cur}</textarea>
            <div class="btn-row" style="margin-top:10px">
              <button class="btn btn-primary" id="sGo">拆解句子</button>
              <button class="btn" id="sSay">🔊 朗读</button>
              <button class="btn" id="sRand">随机例句</button>
            </div>
            <div id="sOut" style="margin-top:16px"></div>
          </div>
          <div>
            <div class="card card-pad" style="margin-bottom:12px">
              <h4 style="margin:0 0 10px;font-size:13.5px">示例句</h4>
              <div id="sampleList"></div>
            </div>
            <div class="card card-pad">
              <h4 style="margin:0 0 10px;font-size:13.5px">图例</h4>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                ${Object.keys(ROLE_COLOR).map(k => `<span class="tag" style="border-left:3px solid ${ROLE_COLOR[k]}">${k}</span>`).join("")}
              </div>
              <div class="divider"><span>为什么要拆解</span></div>
              <div style="font-size:12.5px;line-height:1.9;color:var(--text-2)">
                <div>· 德语的<b>动词框架</b>（变位动词 + 句末补足）决定了句子节奏</div>
                <div>· 从句把动词推到<b>句末</b>，这是中国学生最常犯的错误</div>
                <div>· 冠词变位直接暴露<b>格</b>（den=A、dem=D、des=G）</div>
              </div>
            </div>
          </div>
        </div>`;
      const sl = host.querySelector("#sampleList");
      sl.innerHTML = SAMPLES.map((s, i) => `
        <div class="list-item" data-i="${i}" style="padding:9px 4px;cursor:pointer">
          <div class="main"><div class="t1" style="font-size:12.5px">${s}</div></div></div>`).join("");
      [...sl.children].forEach(c => c.onclick = () => { cur = SAMPLES[+c.dataset.i]; host.querySelector("#sIn").value = cur; run(host); });
      host.querySelector("#sGo").onclick = () => { cur = host.querySelector("#sIn").value.trim(); run(host); };
      host.querySelector("#sSay").onclick = () => window.LD.SpeechUtil.say(host.querySelector("#sIn").value.trim());
      host.querySelector("#sRand").onclick = () => { cur = SAMPLES[Math.floor(Math.random() * SAMPLES.length)]; host.querySelector("#sIn").value = cur; run(host); };
      run(host);
    }
  };

  /* ---------- 规则式成分标注器 ---------- */
  function analyze(sentence) {
    const raw = sentence.trim().replace(/[.!?]+$/, "");
    const tokens = raw.split(/\s+/);
    const out = tokens.map((t, i) => {
      const clean = t.replace(/[.,;:!?„“”"]/g, "");
      const low = clean.toLowerCase();
      let role = "其他", note = "";

      // 从句连词
      if (SUBJUNCT.includes(low)) { role = "连词"; note = "引导从句，动词置于从句末尾"; }
      // 介词
      else if ([...PREP_A, ...PREP_D, ...PREP_AD, ...PREP_G].includes(low)) {
        role = "介词短语";
        note = PREP_A.includes(low) ? "支配第四格 (A)" : PREP_D.includes(low) ? "支配第三格 (D)"
          : PREP_AD.includes(low) ? "双向介词：静三动四" : "支配第二格 (G)";
      }
      // 变位动词 / 助动词
      else if (AUX.includes(low)) { role = "谓语"; note = "变位动词（助动词/情态动词）"; }
      // 第二分词或典型实义动词（以 -en 结尾且在词库中标为动词）
      else if (isVerb(clean)) { role = "谓语"; note = "实义动词"; }
      // 冠词：标注格
      else if (ART[low]) {
        const caseInfo = ART[low].c;
        // 判断该词组在句中的角色：句首多为宾语或主语，介词后为介词宾语
        const prev = (tokens[i - 1] || "").toLowerCase().replace(/[.,]/g, "");
        const isAfterPrep = [...PREP_A, ...PREP_D, ...PREP_AD, ...PREP_G].includes(prev);
        if (isAfterPrep) { role = "介词短语"; }
        else if (i === 0 || /^(ich|du|er|sie|es|wir|ihr)$/.test(prev)) role = "宾语";
        else role = "宾语";
        note = `冠词 → ${caseInfo} 格${ART[low].g ? " · " + ART[low].g + " 性" : ""}`;
      }
      // 代词
      else if (["ich", "du", "er", "sie", "es", "wir", "ihr", "man", "mir", "mich", "dich", "ihm", "ihn", "uns"].includes(low)) {
        role = (i === 0 || low === "ich" || low === "wir" || low === "er" || low === "es" || low === "man") ? "主语" : "宾语";
        note = ART[low] ? `${ART[low].c} 格` : "";
      }
      // 时间 / 地点副词
      else if (/^(gestern|heute|morgen|immer|oft|nie|jetzt|schon|noch|dann|danach|jeden)$/i.test(low)) { role = "状语"; note = "时间状语"; }
      else if (/^(hier|dort|oben|unten|überall|zu|nach)$/i.test(low)) { role = "状语"; note = "地点状语"; }
      // 名词（首字母大写且非句首）
      else if (/^[A-ZÄÖÜ]/.test(clean) && i > 0) { role = isPrevArt(tokens[i - 1]) ? "宾语" : "宾语"; note = "名词"; }
      else if (i === 0 && /^[A-ZÄÖÜ]/.test(clean)) { role = "主语"; note = "句首名词（多为主语）"; }
      // 形容词
      else if (/^(gute|guter|kleine|große|deutsche|lange|schöne|neue|alte|interessante)$/i.test(low)) { role = "定语"; note = "形容词（随性数格变化）"; }

      return { t, clean, role, note };
    });

    // 结构判定
    const hasSub = tokens.some(t => SUBJUNCT.includes(t.toLowerCase().replace(/[.,]/g, "")));
    const verbIdx = out.findIndex(o => o.role === "谓语");
    const lastVerbIdx = out.map(o => o.role).lastIndexOf("谓语");
    const structure = [];
    if (hasSub) structure.push({ k: "含从句", v: "从句中变位动词位于句末（Verb-Endstellung）" });
    if (verbIdx === 0 || verbIdx === 1) structure.push({ k: "动词第二位", v: "陈述句 V2 结构成立" });
    else if (verbIdx > 1) structure.push({ k: "动词位置异常", v: `变位动词位于第 ${verbIdx + 1} 位，疑似语序错误` });
    if (lastVerbIdx > verbIdx) structure.push({ k: "动词框架", v: `句子由「${out[verbIdx].clean} … ${out[lastVerbIdx].clean}」构成框架` });
    const counts = {};
    out.forEach(o => counts[o.role] = (counts[o.role] || 0) + 1);

    return { tokens: out, structure, counts, hasSub };
  }

  function isVerb(w) {
    const lex = window.LD_LEX || [];
    const hit = lex.find(x => x[0].toLowerCase() === w.toLowerCase());
    if (hit) return hit[3] === "v";
    return /^(ge|be|ver|ent|er|zer)/.test(w.toLowerCase()) && /(t|en)$/.test(w.toLowerCase());
  }
  const isPrevArt = p => ART[(p || "").toLowerCase().replace(/[.,]/g, "")] != null;

  function run(host) {
    const out = host.querySelector("#sOut");
    if (!cur) return;
    const r = analyze(cur);
    out.innerHTML = `
      <div class="card" style="background:var(--panel-2)">
        <div class="card-pad">
          <div style="font-size:12px;color:var(--text-3);margin-bottom:10px">成分标注（鼠标悬停查看说明）</div>
          <div style="line-height:2.6;font-size:16px">
            ${r.tokens.map(o => `<span class="tok" title="${o.note}" style="border-bottom:2px solid ${ROLE_COLOR[o.role]};padding:2px 3px;margin-right:4px">${esc(o.t)}</span>`).join(" ")}
          </div>
          <div style="margin-top:14px;display:flex;flex-direction:column;gap:7px">
            ${r.tokens.filter(o => o.note).slice(0, 8).map(o => `
              <div style="display:flex;gap:8px;font-size:13px;align-items:baseline">
                <span style="min-width:88px;color:${ROLE_COLOR[o.role]};font-weight:600">${o.role}</span>
                <b>${esc(o.clean)}</b>
                <span style="color:var(--text-3)">${esc(o.note)}</span>
              </div>`).join("")}
          </div>
        </div>
      </div>
      <div class="grid g2" style="margin-top:12px">
        <div class="card card-pad">
          <h4 style="margin:0 0 10px;font-size:13.5px">结构判定</h4>
          ${r.structure.length ? r.structure.map(s => `<div style="font-size:13px;line-height:1.9">· <b>${s.k}</b>：${s.v}</div>`).join("")
        : `<div style="font-size:13px;color:var(--text-3)">简单句，注意动词第二位。</div>`}
        </div>
        <div class="card card-pad">
          <h4 style="margin:0 0 10px;font-size:13.5px">成分分布</h4>
          <div id="roleBars"></div>
        </div>
      </div>`;
    window.LD.Charts.bars(out.querySelector("#roleBars"),
      Object.keys(r.counts).map(k => ({ k, v: r.counts[k], color: ROLE_COLOR[k] })), { h: 150 });
  }

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  window.LD.Modules = window.LD.Modules || {};
  window.LD.Modules.syntax = Mod;
})();

</script>

    bind("cfgModel", "model", "cfg"); bind("cfgBackend", "backend", "cfg");

    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([window.LD.Store.exportData()], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "linguade-export-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      UI.toast("学习数据已导出", "ok");
    };
    document.getElementById("resetBtn").onclick = () => {
      if (confirm("确定清空全部学习数据？该操作不可恢复。")) {
        window.LD.Store.reset(); location.reload();
      }
    };
  }

  function bindShell() {
    [...document.querySelectorAll(".nav-item")].forEach(n => n.onclick = () => UI.go(n.dataset.route));
    document.querySelector(".brand").onclick = () => UI.go("home");
    document.getElementById("themeBtn").onclick = () => {
      const dark = document.documentElement.classList.toggle("dark");
      S().cfg.theme = dark ? "dark" : "light";
      window.LD.Store.save();
    };
    document.getElementById("syncBtn").onclick = () => {
      if (!S().cfg.backend) { UI.toast("请先在设置中填写后端地址", "err"); return; }
      window.LD.Store.sync()
        .then(r => UI.toast("已同步到后端：" + (r.ok || "成功"), "ok"))
        .catch(e => UI.toast("同步失败：" + e.message, "err"));
    };
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
      if (e.code === "Space" && curRoute === "vocab") {
        const f = document.getElementById("view").querySelector("#flipBtn");
        if (f) { e.preventDefault(); f.click(); }
      }
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    if (S().cfg.theme === "dark") document.documentElement.classList.add("dark");
    bindShell(); bindSettings();
    updateChips();
    UI.go(S().diagnosed ? "home" : "diagnose");
  });

  window.LD.UI = UI;
})();

</script>
</body>
</html>
