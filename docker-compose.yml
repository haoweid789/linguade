services:
  # 后端：FastAPI（可选能力——云端大模型 / 语音转写 / 数据同步）
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      # 华为云 MaaS / ModelArts Studio（OpenAI 兼容）。留空则后端返回「未配置」，前端自动降级本地规则引擎
      - LINGUADE_LLM_BASE_URL=${LINGUADE_LLM_BASE_URL:-}
      - LINGUADE_LLM_API_KEY=${LINGUADE_LLM_API_KEY:-}
      - LINGUADE_LLM_MODEL=${LINGUADE_LLM_MODEL:-gpt-4o-mini}
      # 昇腾 AI 云服务上的 Whisper 推理服务（德语语音）
      - LINGUADE_ASR_BASE_URL=${LINGUADE_ASR_BASE_URL:-}
      - LINGUADE_ASR_API_KEY=${LINGUADE_ASR_API_KEY:-}
      # 华为云 OCR 手写识别（可选前置通道，失败回落视觉大模型）
      - LINGUADE_OCR_BASE_URL=${LINGUADE_OCR_BASE_URL:-}
      - LINGUADE_OCR_PROJECT_ID=${LINGUADE_OCR_PROJECT_ID:-}
      - LINGUADE_OCR_AK=${LINGUADE_OCR_AK:-}
      - LINGUADE_OCR_SK=${LINGUADE_OCR_SK:-}
      # 发音合成 TTS（3.14.0 可选）：off（默认，前端回落浏览器 TTS）/ siliconflow（语言 API Key，德语可用）/ hwcloud（SIS，中英文音色）
      - LINGUADE_TTS_CHANNEL=${LINGUADE_TTS_CHANNEL:-off}
      - LINGUADE_SILICONFLOW_API_KEY=${LINGUADE_SILICONFLOW_API_KEY:-}
      - LINGUADE_SILICONFLOW_TTS_MODEL=${LINGUADE_SILICONFLOW_TTS_MODEL:-heygen/heygen-voice-1-turbo}
      - LINGUADE_SILICONFLOW_TTS_VOICE=${LINGUADE_SILICONFLOW_TTS_VOICE:-}
      - LINGUADE_TTS_SIS_ENDPOINT=${LINGUADE_TTS_SIS_ENDPOINT:-}
      - LINGUADE_TTS_SIS_PROPERTY=${LINGUADE_TTS_SIS_PROPERTY:-chinese_xiaoyu_common}
      - LINGUADE_VOXCPM_BASE_URL=${LINGUADE_VOXCPM_BASE_URL:-}
      - LINGUADE_VOXCPM_API_KEY=${LINGUADE_VOXCPM_API_KEY:-}
      - LINGUADE_VOXCPM_MODEL=${LINGUADE_VOXCPM_MODEL:-openbmb/VoxCPM2}
      - LINGUADE_VOXCPM_VOICE=${LINGUADE_VOXCPM_VOICE:-}
      # 可选外部通道（3.7.0）：音素评估 / 知识追踪，默认零依赖本地实现（rule / bkt）
      - LINGUADE_PHONEME_CHANNEL=${LINGUADE_PHONEME_CHANNEL:-rule}
      - LINGUADE_PHONEME_BASE_URL=${LINGUADE_PHONEME_BASE_URL:-}
      - LINGUADE_KT_CHANNEL=${LINGUADE_KT_CHANNEL:-bkt}
      - LINGUADE_KT_BASE_URL=${LINGUADE_KT_BASE_URL:-}
      # 数据层：默认 SQLite 写在容器内 /data（由下方 volume 持久化到宿主 ./data）
      # 注意 SQLAlchemy 绝对路径需要四个斜杠：sqlite+aiosqlite:////data/linguade.db
      - LINGUADE_DATABASE_URL=${LINGUADE_DATABASE_URL:-sqlite+aiosqlite:////data/linguade.db}
      # 缓存：留空则使用进程内缓存（已实现降级）
      - LINGUADE_REDIS_URL=${LINGUADE_REDIS_URL:-}
      - LINGUADE_CORS_ORIGINS=${LINGUADE_CORS_ORIGINS:-*}
      # 账号体系：邀请码为空则注册关闭；admin_user 指定的用户名注册后成为管理员
      - LINGUADE_INVITE_CODE=${LINGUADE_INVITE_CODE:-}
      - LINGUADE_ADMIN_USER=${LINGUADE_ADMIN_USER:-owner}
      - LINGUADE_SESSION_DAYS=${LINGUADE_SESSION_DAYS:-7}
      - LINGUADE_COOKIE_SECURE=${LINGUADE_COOKIE_SECURE:-0}
    expose:
      - "8000"
    volumes:
      # SQLite 落宿主 ./data，容器重建不丢学习数据
      - ./data:/data
    restart: unless-stopped

  # 前端：nginx 托管单文件产物，并把 /api 反向代理到后端（同源，免 CORS）
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        # 比赛/演示默认 HTTP 8080；备案与证书就绪后改为 nginx.conf
        NGINX_CONF: ${LINGUADE_NGINX_CONF:-nginx.http.conf}
    ports:
      # 公网端口可覆盖；容器内 nginx 固定监听 8080（与 auto-deploy 默认健康检查端口一致）
      - "${LINGUADE_HTTP_PORT:-8080}:8080"
    volumes:
      # HTTP 演示不需要证书；HTTPS 覆盖时再挂载 deploy/certs
      - ./deploy/webroot/.well-known/acme-challenge:/usr/share/nginx/html/.well-known/acme-challenge:ro
    depends_on:
      - backend
    restart: unless-stopped