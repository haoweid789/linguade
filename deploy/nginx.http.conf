# LinguaDE · 比赛/演示入口（HTTP 8080，无证书依赖）
# 与 nginx.conf 的区别：仅监听 8080、不做 80→443 跳转、不加载 TLS 证书。
# 备案与证书就绪后，可用 LINGUADE_NGINX_CONF=nginx.conf 切回 HTTPS 配置。
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 ocr.py 允许到 6 MB 图片，nginx 默认 1 MB 会先一步返回 413
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    # 单文件应用无外部脚本；内联脚本/样式与 blob 录音、Tatoeba 音频需白名单
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:" always;

    # 后端 API 反代：前端与后端同源，省去 CORS 与混合内容问题
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式对话必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location = /sw.js {
        # Service Worker 本身必须每次回源校验，否则旧版外壳会长期滞留
        expires -1;
    }

    # 老浏览器仍会直接请求 /favicon.ico；返回真实图标而不是 SPA 首页 HTML
    location = /favicon.ico {
        try_files /icon.svg =404;
    }

    # 部署健康检查（容器内自检，不依赖后端）
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # 站点根路径是营销落地页；应用本体仍在 /index.html（PWA start_url 同样指向它）
    location = / {
        expires -1;
        try_files /landing.html =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}