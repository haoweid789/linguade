# LinguaDE · HTTPS 反向代理模板（备案通过、证书就绪后启用）

把 `__DOMAIN__` 全部替换成实际域名（例如 `linguade.example.com`），
证书放到 `deploy/certs/fullchain.pem` 与 `deploy/certs/privkey.pem`，
然后用本文件覆盖 `deploy/nginx.conf`，重建 frontend 容器。

生成最终配置的一行命令（在仓库根目录执行）：

```bash
sed 's/__DOMAIN__/你的域名/g' deploy/nginx.https.conf > deploy/nginx.conf
```

注意：
- 证书必须是**完整链**（fullchain），否则部分安卓机会提示证书无效；
- 首次上线先不要加 HSTS，确认 HTTPS 正常后再加 `Strict-Transport-Security`；
- 站点是单页应用，`/api` 走同源反代，因此 CORS 可以不放开。

```nginx
# HTTP：仅用于跳转与证书续期校验
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # 证书续期 / 备案核验可能走 80，保留一个健康响应
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 ocr.py 允许到 6 MB 图片，nginx 默认 1 MB 会先一步返回 413
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json text/html;

    # 外壳与 SW 必须即时更新，避免回访用户卡在旧版本
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # 站点根路径是营销落地页；应用本体仍在 /index.html（PWA start_url 同样指向它）
    location = / {
        add_header Cache-Control "no-cache";
        try_files /landing.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代：同源，省去 CORS；SSE 必须关闭缓冲
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
```
